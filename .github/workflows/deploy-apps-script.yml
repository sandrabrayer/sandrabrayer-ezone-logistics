name: Deploy Apps Script

# Automatically pushes apps-script/** to the Google Apps Script project and
# publishes a NEW VERSION of the EXISTING deployment (same deployment ID → the
# /exec URL never changes, so consumers keep working).
#
# Fires only when the Apps Script sources actually change on the deployed
# branch. Requires two GitHub secrets — see DEPLOY.md:
#   - CLASPRC_JSON  : contents of ~/.clasprc.json from a local `clasp login`
#   - DEPLOYMENT_ID : the existing Web App deployment ID (starts with "AKfyc")

on:
  push:
    branches:
      # The Logistics Railway/production branch (per EZONE-ECOSYSTEM-STATUS.md).
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  # Manual on-demand deploy from the Actions tab (Run workflow → pick the branch).
  workflow_dispatch:

# Never let two deploys race on the same Apps Script project.
concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify required secrets are present (fail loudly if not)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          APPS_SCRIPT_EXEC_URL: ${{ secrets.APPS_SCRIPT_EXEC_URL }}
        run: |
          missing=0
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing secret CLASPRC_JSON. Run 'clasp login' locally and copy ~/.clasprc.json into the CLASPRC_JSON GitHub secret. See DEPLOY.md."
            missing=1
          fi
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Missing secret DEPLOYMENT_ID. Apps Script editor → Deploy → Manage deployments → copy the deployment ID (starts with 'AKfyc'). See DEPLOY.md."
            missing=1
          fi
          if [ -z "$APPS_SCRIPT_EXEC_URL" ]; then
            echo "::error::Missing secret APPS_SCRIPT_EXEC_URL. This is the live Web App /exec URL (the SAME value Railway uses as APPS_SCRIPT_EXEC_URL). Post-deploy verification hits it to prove the live deployment actually serves the new code — without it a green deploy can hide a stale production. See DEPLOY.md."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required deploy credentials are missing — aborting BEFORE touching the live deployment, so the /exec URL and its consumers are never disturbed by a broken run."
            exit 1
          fi

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))" \
            || { echo "::error::CLASPRC_JSON is not valid JSON. Re-run 'clasp login' locally and re-copy the whole ~/.clasprc.json into the secret. See DEPLOY.md."; exit 1; }

      - name: Stamp the commit SHA into Code.gs (deploy provenance)
        run: |
          # Write the exact SHA being deployed into DEPLOY_COMMIT, so the live action=version returns it and
          # the post-deploy check below can prove THIS commit is what production serves.
          sed -i "s/var DEPLOY_COMMIT = '[^']*';/var DEPLOY_COMMIT = '${GITHUB_SHA}';/" apps-script/Code.gs
          if ! grep -q "var DEPLOY_COMMIT = '${GITHUB_SHA}';" apps-script/Code.gs; then
            echo "::error::Could not stamp DEPLOY_COMMIT into apps-script/Code.gs (the 'var DEPLOY_COMMIT = ...' line is missing or changed shape). Fix the marker line, then redeploy."
            exit 1
          fi
          echo "Stamped DEPLOY_COMMIT = ${GITHUB_SHA}"

      - name: Push code to the Apps Script project
        run: clasp push -f

      - name: Redeploy the EXISTING deployment (new version, same /exec URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set +e
          dep="$(printf '%s' "$DEPLOYMENT_ID" | tr -d '[:space:]')"
          out="$(clasp deploy -i "$dep" -d "CI deploy ${GITHUB_SHA} on ${GITHUB_REF_NAME}" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ] || ! printf '%s\n' "$out" | grep -q 'Deployed'; then
            echo "::error::clasp did NOT redeploy the existing deployment (no 'Deployed …@<version>' confirmation). The DEPLOYMENT_ID secret must be the EXISTING Web App deployment ID (starts with 'AKfyc') — not the /exec URL, the Script ID, or a value with quotes/whitespace. Existing deployments for this project:"
            clasp list-deployments || true
            exit 1
          fi
          echo "Redeploy confirmed — new version of the EXISTING deployment (same /exec URL)."

      - name: Verify the LIVE /exec serves the new code (post-deploy smoke)
        env:
          APPS_SCRIPT_EXEC_URL: ${{ secrets.APPS_SCRIPT_EXEC_URL }}
        run: |
          # clasp printing "Deployed" only proves it redeployed the deployment named by DEPLOYMENT_ID.
          # It does NOT prove that deployment is the one production actually calls. If DEPLOYMENT_ID and
          # APPS_SCRIPT_EXEC_URL point at DIFFERENT deployments, CI stays green while production is stale.
          # This step closes that gap by probing the REAL /exec (the same URL Railway uses):
          #   - action=users   → exists on EVERY published version (baseline: is the URL even reachable?)
          #   - action=bundle  → exists ONLY on the current Code.gs (recent-only: is the NEW code live?)
          # An older/other deployment answers bundle with {"ok":false,"error":"Unknown or missing action"}.
          # The STRONGEST check: action=version returns the exact SHA CI just stamped + deployed. If it
          # equals GITHUB_SHA, the deployment behind APPS_SCRIPT_EXEC_URL is provably THIS commit. bundle
          # (recent-only) and users (baseline) are still probed to make a failure message actionable.
          url="$(printf '%s' "$APPS_SCRIPT_EXEC_URL" | tr -d '[:space:]')"
          want="$(printf '%s' "$GITHUB_SHA" | tr -d '[:space:]')"
          probe() { curl -fsSL --max-time 25 "$1" 2>/dev/null; }
          attempt=0; max=6; delay=3; base_ok=0; bundle_ok=0; ver=""
          while [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt + 1))
            ver="$(probe "${url}?action=version")"
            if printf '%s' "$ver" | grep -q "\"commit\":\"${want}\""; then
              echo "Post-deploy verification OK — live /exec action=version == ${want} (this exact commit is live)."
              exit 0
            fi
            if printf '%s' "$(probe "${url}?action=bundle&sheets=houses")" | grep -q '"houses"'; then bundle_ok=1; fi
            if printf '%s' "$(probe "${url}?action=users")" | grep -q '"ok":true'; then base_ok=1; fi
            echo "attempt ${attempt}/${max}: action=version != ${want} yet (new versions take a few seconds to propagate); retrying in ${delay}s…"
            sleep "$delay"; delay=$((delay * 2))
          done
          obs="$(printf '%s' "$ver" | grep -oE '"commit":"[^"]*"' | head -1)"
          if [ "$base_ok" -eq 1 ] || [ "$bundle_ok" -eq 1 ]; then
            echo "::error::LIVE /exec is reachable but action=version is NOT ${want} (observed: ${obs:-none/older-deploy-without-version}). clasp reported 'Deployed', yet the deployment behind APPS_SCRIPT_EXEC_URL is STALE or names a DIFFERENT deployment than DEPLOYMENT_ID. Fix: in the Apps Script editor → Manage deployments, set DEPLOYMENT_ID to the deployment whose /exec URL equals APPS_SCRIPT_EXEC_URL. See DEPLOY.md."
          else
            echo "::error::LIVE /exec did not answer even the baseline 'users' action at APPS_SCRIPT_EXEC_URL. The URL is wrong/unreachable, or the Web App access is not 'Anyone' (anonymous). Fix APPS_SCRIPT_EXEC_URL (and the manifest access) — see DEPLOY.md."
          fi
          echo "---- last version response (truncated) ----"
          printf '%s\n' "$ver" | head -c 300
          exit 1

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$HOME/.clasprc.json"
