<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZone לוגיסטיקה — ניהול תפעולי רשת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #15171c; --bg2: #1b1e24; --card: #1f232b; --card-line: #333a45;
      --ink: #eef1f5; --muted: #8b93a0; --accent: #2dd4bf; --accent-2: #5eead4;
      --accent-grad: linear-gradient(120deg, #14b8a6 0%, #2dd4bf 50%, #5eead4 100%);
      --glow: rgba(45,212,191,.45); --red: #e0584a; --amber: #e0a23a; --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(1100px 480px at 82% -12%, #262b36 0%, transparent 58%), var(--bg); font-family: 'Heebo', "Segoe UI", system-ui, Arial, sans-serif; line-height: 1.55; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--card-line); background: linear-gradient(180deg, var(--bg2), transparent); }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
    .brand-emblem { width: 30px; height: 30px; }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { font-size: .92rem; font-weight: 700; color: #c8cdd6; text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid transparent; }
    .nav a:hover { color: var(--ink); border-color: var(--card-line); }
    .nav a.active { color: #14171c; background: var(--accent-grad); }
    .wrap { max-width: 1020px; margin: 0 auto; padding: 22px 18px 64px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin: 6px 0 2px; color: #fff; }
    .sub { color: #b8bfc9; margin: 0 0 18px; font-size: .95rem; }
    h2 { font-size: 1.15rem; margin: 26px 0 12px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .kpi { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius); padding: 16px; }
    .kpi.alarm { border-color: var(--red); box-shadow: 0 0 30px -14px var(--red); }
    .kpi .n { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
    .kpi .l { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .kpi .n.red { color: var(--red); } .kpi .n.amber { color: var(--amber); } .kpi .n.ok { color: var(--accent-2); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius); overflow: hidden; }
    th, td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--card-line); }
    th { color: var(--accent-2); font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    .pill { font-size: .74rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
    .pill.red { background: #3a1512; color: #ff8a80; } .pill.amber { background: #4a3410; color: var(--amber); }
    .pill.ok { background: #06251f; color: var(--accent-2); }
    /* notRecorded — a deliberately NEUTRAL pill (never green/ok): a missing record must not read as fine. */
    .pill.gray { background: #2a2f38; color: #aeb6c2; }
    .unavail { background: repeating-linear-gradient(135deg, #23262e, #23262e 8px, #20232b 8px, #20232b 16px); border: 1px dashed var(--card-line); border-radius: 12px; padding: 12px 14px; }
    .unavail .t { font-weight: 800; color: #cfd5de; }
    .unavail .r { color: var(--muted); font-size: .85rem; margin-top: 3px; }
    .na { color: var(--muted); font-style: italic; }
    .loading, .empty { color: var(--muted); }
    .deny { background: var(--card); border: 1px solid var(--red); border-radius: var(--radius); padding: 28px; text-align: center; color: #ff8a80; font-weight: 700; }
    @media (max-width: 640px) {
      html, body { overflow-x: hidden; max-width: 100vw; }
      .topbar { flex-wrap: wrap; gap: 10px; }
      .nav { order: 2; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .nav::-webkit-scrollbar { display: none; }
      .nav a { flex: 0 0 auto; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <!-- The /management nav link is injected by the auth shim for exec roles only (ops_manager/ceo),
         so it never shows for other roles. Kept out of the static markup on purpose. -->
    <nav class="nav"><a href="/">דרישה חדשה</a><a href="/dashboard">דשבורד</a><a href="/workorders">משימות</a><a href="/inventory">מלאי</a><a href="/inspection">בקרה</a><a href="/reports">דוחות</a></nav>
    <div class="brand"><img class="brand-emblem" src="/icon-v1-192.png" alt="" /><span>לוגיסטיקה</span></div>
  </div>
  <div class="wrap">
    <h1>ניהול תפעולי רשת</h1>
    <p class="sub">מסך הנהלה (מנהלת תפעול / מנכ״לית). מוצג רק מה שיש לו מקור נתונים אמיתי בלוגיסטיקה — מדד ללא מקור מסומן במפורש כ״לא זמין״, לעולם לא כאפס.</p>
    <div id="out"><p class="loading">טוען…</p></div>
  </div>

  <script>
    const EXEC_URL = window.__EXEC_URL__ || '__EXEC_URL__';

    // ---- Aggregation mirror of src/management.js (read-only view; the server is the gate). ----
    const CLOSED = ['הושלם', 'סגור'];
    const TERMINAL = ['הושלם', 'סגור', 'לא מאושר'];
    const isOpenReq = (r) => r && TERMINAL.indexOf(String(r.status)) === -1;
    const isBlockedR = (r) => String(r.blocked == null ? '' : r.blocked).toUpperCase() === 'TRUE';
    function isOverdueR(r, now) {
      if (!r.due_at) return false;
      if (r.status === 'הושלם' || r.status === 'סגור' || r.status === 'נדחה לתאריך') return false;
      const due = new Date(r.due_at).getTime();
      return !isNaN(due) && now > due;
    }
    const daysOverdueR = (r, now) => Math.floor((now - new Date(r.due_at).getTime()) / 86400000);

    function build(d, now) {
      const reqs = d.requests || [], findings = d.findings || [], inspections = d.inspections || [],
        houses = d.houses || [], counts = d.inventoryCounts || [];
      const open = reqs.filter(isOpenReq);

      // Panel: SLA / delays
      const byHouse = {};
      open.forEach((r) => {
        const b = byHouse[r.house] || (byHouse[r.house] = { house: r.house, open: 0, overdue: 0, blocked: 0 });
        b.open++; if (isOverdueR(r, now)) b.overdue++; if (isBlockedR(r)) b.blocked++;
      });
      const overdue = open.filter((r) => isOverdueR(r, now));
      const worst = overdue.map((r) => ({ ...r, dov: daysOverdueR(r, now) })).sort((a, b) => b.dov - a.dov);
      const sla = { openCount: open.length, overdueCount: overdue.length,
        blockedCount: open.filter(isBlockedR).length, byHouse: Object.values(byHouse), worst };

      // Panel: defect closure
      const reqById = {}; reqs.forEach((r) => reqById[String(r.id)] = r);
      const defects = findings.filter((f) => f && f.finding_type === 'physical_defect');
      let dOpen = 0, onTime = 0, late = 0, noDue = 0;
      defects.forEach((f) => {
        const r = f.linked_request_id ? reqById[String(f.linked_request_id)] : null;
        if (!r || CLOSED.indexOf(String(r.status)) === -1) { dOpen++; return; }
        if (r.due_at && r.completed_at) {
          if (new Date(r.completed_at).getTime() <= new Date(r.due_at).getTime()) onTime++; else late++;
        } else noDue++;
      });
      const measured = onTime + late;
      const defectClosure = { total: defects.length, open: dOpen, onTime, late, noDue,
        rate: measured > 0 ? Math.round(100 * onTime / measured) : null };

      // Panel: house quality
      const insById = {}; inspections.forEach((i) => { if (i && i.id != null) insById[String(i.id)] = i; });
      const hq = {};
      houses.forEach((h) => hq[h.name] = { house: h.name, status: h.status, last: '', low: 0, medium: 0, high: 0, recurring: 0 });
      inspections.forEach((i) => { const b = hq[i.house]; if (b) { const dt = String(i.inspection_date || ''); if (dt > b.last) b.last = dt; } });
      const tally = {};
      findings.forEach((f) => {
        if (!f || f.finding_type !== 'physical_defect') return;
        const ins = insById[String(f.inspection_id)]; const house = ins ? ins.house : ''; const b = hq[house]; if (!b) return;
        if (!f.linked_request_id) { const s = String(f.severity || '').toLowerCase(); b[(s === 'medium' || s === 'high') ? s : 'low']++; }
        const k = String(f.finding_text || '').trim().replace(/\s+/g, ' ').toLowerCase();
        if (k) { (tally[house] = tally[house] || {})[k] = ((tally[house] || {})[k] || 0) + 1; }
      });
      Object.keys(tally).forEach((house) => { if (hq[house]) hq[house].recurring = Object.values(tally[house]).filter((n) => n >= 2).length; });

      // Panel: spend (owned cost)
      let est = 0, act = 0; const spendHouse = {};
      reqs.forEach((r) => { const e = Number(r.estimated_cost) || 0, a = Number(r.actual_cost) || 0; est += e; act += a;
        const b = spendHouse[r.house] || (spendHouse[r.house] = { house: r.house, estimated: 0, actual: 0 }); b.estimated += e; b.actual += a; });

      // Panel: pre-opening readiness
      const countedHouse = {}; counts.forEach((c) => { if (c && c.house) countedHouse[c.house] = true; });
      const pre = houses.filter((h) => String(h.status) === 'pre-opening').map((h) => ({
        house: h.name,
        openRequests: reqs.filter((r) => r.house === h.name && isOpenReq(r)).length,
        openDefects: findings.filter((f) => f && f.finding_type === 'physical_defect' && !f.linked_request_id && insById[String(f.inspection_id)] && insById[String(f.inspection_id)].house === h.name).length,
        inventoryCounted: !!countedHouse[h.name],
      }));

      // kitchen + coordinators + budget + maintenance + compliance are computed SERVER-SIDE (Code.gs)
      // and passed through as-is; the browser only renders them.
      return { sla, defectClosure, houseQuality: Object.values(hq), spend: { est, act, byHouse: Object.values(spendHouse) },
        preOpening: pre, kitchen: d.kitchen || null, coordinators: d.coordinators || null, budget: d.budget || null,
        maintenance: d.maintenance || null, compliance: d.compliance || null, events: d.events || null,
        training: d.training || null };
    }

    // The (c) items — no source in this repo. Mirror of UNAVAILABLE_CAPABILITIES (food_quality, budget,
    // preventive_maintenance and training_adherence are now LIVE panels below, so they are no longer here).
    const UNAVAILABLE = [
      ['הטמעת מערכות', 'אין מקור נתוני הטמעת תוכנות/אפליקציות.'],
      ['איכות הרשומה ועמידה בדרישות משרד הבריאות', 'בבעלות האפליקציות הקליניות; אינו בתחום הלוגיסטיקה.'],
    ];

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const nis = (n) => '₪' + Number(n || 0).toLocaleString('he-IL');
    const fmtDate = (v) => { const m = String(v || '').slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (v ? esc(v) : '—'); };

    function kpi(n, label, cls, alarm) {
      return `<div class="kpi${alarm ? ' alarm' : ''}"><div class="n ${cls || ''}">${n}</div><div class="l">${esc(label)}</div></div>`;
    }
    // A metric with no data source → explicit "לא זמין", never 0.
    function naKpi(label) { return `<div class="kpi"><div class="n na">לא זמין</div><div class="l">${esc(label)}</div></div>`; }

    function render(m) {
      const s = m.sla, dc = m.defectClosure;
      let html = '';

      html += '<h2>עיכובים ו-SLA (הצפת עיכובים)</h2><div class="grid">';
      html += kpi(s.openCount, 'דרישות פתוחות');
      html += kpi(s.overdueCount, 'באיחור (חריגה מיעד)', s.overdueCount ? 'red' : 'ok', s.overdueCount > 0);
      html += kpi(s.blockedCount, 'חסומות', s.blockedCount ? 'amber' : 'ok');
      html += '</div>';
      if (s.worst.length) {
        html += '<h2>הדרישות הכי באיחור</h2><table><thead><tr><th>בית</th><th>תיאור</th><th>דחיפות</th><th>ימי איחור</th><th></th></tr></thead><tbody>';
        html += s.worst.slice(0, 12).map((r) => `<tr><td>${esc(r.house)}</td><td>${esc(r.description || r.id)}</td><td>${esc(r.urgency || '')}</td><td><span class="pill red">${r.dov}</span></td><td>${r.blocked ? '<span class="pill amber">חסום</span>' : ''}</td></tr>`).join('');
        html += '</tbody></table>';
      }

      html += '<h2>סגירת ליקויים במועד</h2><div class="grid">';
      html += kpi(dc.total, 'ליקויים (פגמים פיזיים)');
      html += kpi(dc.open, 'ליקויים פתוחים', dc.open ? 'amber' : 'ok');
      html += (dc.rate == null) ? naKpi('אחוז סגירה במועד') : kpi(dc.rate + '%', 'סגירה במועד', dc.rate >= 80 ? 'ok' : 'amber');
      html += kpi(dc.onTime + ' / ' + dc.late, 'במועד / באיחור');
      html += '</div>';
      if (dc.noDue) html += `<p class="sub">(${dc.noDue} ליקויים נסגרו ללא תאריך יעד — לא נכללים באחוז הסגירה במועד.)</p>`;

      html += '<h2>רמת הבתים ואירועים חוזרים</h2><table><thead><tr><th>בית</th><th>סטטוס</th><th>בקרה אחרונה</th><th>ליקויים פתוחים (גבוה/בינוני/נמוך)</th><th>חוזרים</th></tr></thead><tbody>';
      html += m.houseQuality.map((h) => `<tr><td>${esc(h.house)}</td><td>${h.status === 'pre-opening' ? 'טרום-פתיחה' : 'פתוח'}</td><td>${h.last ? fmtDate(h.last) : '<span class="na">אין בקרה</span>'}</td><td><span class="pill red">${h.high}</span> / <span class="pill amber">${h.medium}</span> / ${h.low}</td><td>${h.recurring ? '<span class="pill amber">' + h.recurring + '</span>' : '0'}</td></tr>`).join('');
      html += '</tbody></table>';

      html += '<h2>הוצאות (רכש) — לפי בית</h2><div class="grid">';
      html += kpi(nis(m.spend.act), 'הוצאה בפועל (סה״כ)');
      html += kpi(nis(m.spend.est), 'הערכת עלות (סה״כ)');
      html += naKpi('עמידה בתקציב');
      html += '</div>';
      html += '<table><thead><tr><th>בית</th><th>הערכה</th><th>בפועל</th></tr></thead><tbody>';
      html += m.spend.byHouse.filter((b) => b.house).sort((a, b) => b.actual - a.actual).map((b) => `<tr><td>${esc(b.house)}</td><td>${nis(b.estimated)}</td><td>${nis(b.actual)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">אין נתוני הוצאה.</td></tr>';
      html += '</tbody></table>';

      if (m.preOpening.length) {
        html += '<h2>מוכנות בתים לפתיחה</h2><table><thead><tr><th>בית</th><th>דרישות פתוחות</th><th>ליקויים פתוחים</th><th>ספירת מלאי בוצעה</th></tr></thead><tbody>';
        html += m.preOpening.map((p) => `<tr><td>${esc(p.house)}</td><td>${p.openRequests}</td><td>${p.openDefects}</td><td>${p.inventoryCounted ? '<span class="pill ok">כן</span>' : '<span class="pill amber">לא</span>'}</td></tr>`).join('');
        html += '</tbody></table>';
      }

      // Kitchen food shortages — READ-ONLY from the ezone-kitchen digest. Unavailable renders as a
      // "לא זמין" card with the reason (never as 0); an available-but-empty result says "no shortages".
      html += '<h2>חוסרי מזון לפי בית (דייג׳סט המטבח — קריאה בלבד)</h2>';
      const k = m.kitchen;
      if (!k || !k.available) {
        html += `<div class="unavail"><div class="t">חוסרי מזון — לא זמין</div><div class="r">${esc((k && k.reason) || 'אין מקור נתונים')}</div></div>`;
      } else if (!k.houses || !k.houses.length) {
        html += '<div class="kpi"><div class="n ok">אין חוסרים</div><div class="l">לא דווחו חוסרי מזון כרגע</div></div>';
      } else {
        html += '<table><thead><tr><th>בית</th><th>מספר פריטים בחוסר</th><th>פריטים</th></tr></thead><tbody>';
        html += k.houses.map((h) => `<tr><td>${esc(h.house)}</td><td><span class="pill red">${h.count}</span></td><td>${(h.items || []).map(esc).join('، ')}</td></tr>`).join('');
        html += '</tbody></table>';
      }

      // Coordinators digest — no coordinators-published source exists yet; shown as "לא זמין" with why.
      const co = m.coordinators;
      if (!co || !co.available) {
        html += `<div class="unavail" style="margin-top:8px"><div class="t">דייג׳סט רכזים — לא זמין</div><div class="r">${esc((co && co.reason) || 'אין דייג׳סט רכזים מתפרסם לקריאה')}</div></div>`;
      }

      // Training compliance (עמידה בתוכנית הדרכה) — READ-ONLY from the coordinators-published digest
      // (tab TrainingCompliance). Unavailable (no id / no access / missing tab / header mismatch) renders
      // as a "לא זמין" card with the reason (never as 0). Per house, worst-first guides (blocked, then
      // notRecorded, then warn); notRecorded is a NEUTRAL pill, never green. A house absent from the digest
      // shows "אין נתונים לבית זה" — distinct from the whole digest being unavailable.
      const tr = m.training;
      html += '<h2>עמידה בתוכנית הדרכה (דייג׳סט הרכזים — קריאה בלבד)</h2>';
      if (!tr || !tr.available) {
        html += `<div class="unavail"><div class="t">עמידה בתוכנית הדרכה — לא זמין</div><div class="r">${esc((tr && tr.reason) || 'אין מקור נתוני הדרכה')}</div></div>`;
      } else if (!tr.houses || !tr.houses.length) {
        html += '<div class="kpi"><div class="n na">אין נתונים</div><div class="l">אין בתים במיפוי</div></div>';
      } else {
        const stName = { ok: 'תקין', warn: 'אזהרה', blocked: 'חסום', notRecorded: 'לא תועד' };
        const stCls = { ok: 'ok', warn: 'amber', blocked: 'red', notRecorded: 'gray' };
        const pill = (st) => `<span class="pill ${stCls[st] || 'gray'}">${esc(stName[st] || st || '—')}</span>`;
        html += tr.houses.map((h) => {
          if (!h.hasData) {
            return `<h3 style="margin:14px 0 6px">${esc(h.house)}</h3><div class="unavail" style="margin-bottom:4px"><div class="r">אין נתונים לבית זה</div></div>`;
          }
          const pct = h.compliancePercent == null ? '—' : h.compliancePercent + '%';
          const pctCls = h.compliancePercent == null ? 'na' : (h.compliancePercent >= 80 ? 'ok' : (h.compliancePercent >= 50 ? 'amber' : 'red'));
          const badges = `${h.counts.blocked ? ` <span class="pill red">${h.counts.blocked} חסום</span>` : ''}${h.counts.notRecorded ? ` <span class="pill gray">${h.counts.notRecorded} לא תועד</span>` : ''}${h.counts.warn ? ` <span class="pill amber">${h.counts.warn} אזהרה</span>` : ''}`;
          let block = `<h3 style="margin:14px 0 6px">${esc(h.house)}${badges}</h3>`;
          block += `<div class="grid" style="margin-bottom:8px"><div class="kpi"><div class="n ${pctCls}">${pct}</div><div class="l">עמידה (תקין מתוך ${h.total})</div></div>`;
          block += `<div class="kpi"><div class="n ok">${h.counts.ok}</div><div class="l">תקין</div></div>`;
          block += `<div class="kpi"><div class="n">${h.total}</div><div class="l">מדריכים</div></div></div>`;
          block += '<table><thead><tr><th>מדריך</th><th>סטטוס כללי</th><th>חסר</th><th>עזרה ראשונה</th><th>הדרכת מדריכים</th></tr></thead><tbody>';
          block += h.guides.map((g) => {
            const lacking = (g.lacking && g.lacking.length) ? g.lacking.map(esc).join('، ') : '<span class="na">—</span>';
            const fa = `${pill(g.firstAidStatus)}${g.firstAidDate ? ' ' + esc(g.firstAidDate) : ''}`;
            const ins = `${pill(g.instructorStatus)}${g.instructorDate ? ' ' + esc(g.instructorDate) : ''}`;
            return `<tr><td>${esc(g.guideName) || '<span class="na">—</span>'}</td><td>${pill(g.overallStatus)}</td><td>${lacking}</td><td>${fa}</td><td>${ins}</td></tr>`;
          }).join('');
          block += '</tbody></table>';
          return block;
        }).join('');
      }

      // Budget adherence (עמידה בתקציב) — computed server-side per selected month. Financial data;
      // shown only here (canManage-gated), never in any digest. Over-budget highlighted worst-first;
      // a house with no budget row shows "לא הוגדר תקציב" (never a fabricated 0).
      const bud = m.budget;
      html += '<h2>עמידה בתקציב</h2>';
      if (!bud) {
        html += '<div class="unavail"><div class="t">עמידה בתקציב — לא זמין</div><div class="r">אין נתוני תקציב</div></div>';
      } else {
        const opts = (bud.periods || []).map((p) => `<option value="${esc(p)}"${p === bud.period ? ' selected' : ''}>${esc(p)}</option>`).join('');
        html += `<div class="grid" style="margin-bottom:10px"><div class="kpi"><label class="l">חודש</label><br><select onchange="loadMonth(this.value)" style="margin-top:6px;min-height:36px">${opts || `<option>${esc(bud.period)}</option>`}</select></div></div>`;
        const rows = (bud.adherence && bud.adherence.houses) || [];
        if (!rows.length) {
          html += '<div class="kpi"><div class="n na">אין נתונים</div><div class="l">אין תקציב או הוצאה לחודש זה</div></div>';
        } else {
          html += '<table><thead><tr><th>בית</th><th>תקציב</th><th>בפועל</th><th>יתרה</th><th>ניצול</th><th>סטטוס</th></tr></thead><tbody>';
          html += rows.map((r) => {
            if (!r.budgetDefined) {
              return `<tr><td>${esc(r.house)}</td><td colspan="3" class="na">לא הוגדר תקציב</td><td>—</td><td>${nis(r.actual)} הוצאה${r.usedEstimated ? ' *' : ''}</td></tr>`;
            }
            const pct = r.percentUsed == null ? '—' : r.percentUsed + '%';
            const status = r.over ? '<span class="pill red">חריגה</span>' : (r.percentUsed != null && r.percentUsed >= 90 ? '<span class="pill amber">קרוב לתקרה</span>' : '<span class="pill ok">בתקציב</span>');
            return `<tr><td>${esc(r.house)}</td><td>${nis(r.budget)}</td><td>${nis(r.actual)}${r.usedEstimated ? ' *' : ''}</td><td>${nis(r.remaining)}</td><td>${pct}</td><td>${status}</td></tr>`;
          }).join('');
          html += '</tbody></table>';
          html += '<p class="sub">* כולל אומדן (estimated_cost) כאשר עלות בפועל טרם הוזנה.</p>';
        }
        if (bud.adherence && bud.adherence.skipped) html += `<p class="sub">${bud.adherence.skipped} שורות תקציב לא תקינות דולגו (בדוק פורמט חודש/סכום בגיליון Budgets).</p>`;
      }

      // Preventive maintenance (תחזוקה מונעת) — computed server-side from the MaintenancePlan sheet.
      // Per house, worst-first: overdue tasks first, then soonest-due. A house with no plan row shows
      // "לא הוגדרה תוכנית" (never a fabricated 0). next_due / overdue are derived, never stored.
      const mnt = m.maintenance;
      html += '<h2>תחזוקה מונעת</h2>';
      if (!mnt || !mnt.houses) {
        html += '<div class="unavail"><div class="t">תחזוקה מונעת — לא זמין</div><div class="r">אין נתוני תוכנית תחזוקה</div></div>';
      } else if (!mnt.houses.length) {
        html += '<div class="kpi"><div class="n na">אין נתונים</div><div class="l">אין בתים פעילים</div></div>';
      } else {
        html += mnt.houses.map((h) => {
          let block = `<h3 style="margin:14px 0 6px">${esc(h.house)}${h.overdueCount ? ` <span class="pill red">${h.overdueCount} באיחור</span>` : ''}</h3>`;
          if (!h.planDefined) {
            block += '<div class="unavail" style="margin-bottom:4px"><div class="r">לא הוגדרה תוכנית תחזוקה מונעת לבית זה.</div></div>';
            return block;
          }
          block += '<table><thead><tr><th>משימה</th><th>תדירות</th><th>בוצע לאחרונה</th><th>מועד הבא</th><th>סטטוס</th></tr></thead><tbody>';
          block += h.tasks.map((t) => {
            const freq = `כל ${t.frequency} חוד׳`;
            const last = t.lastDone ? fmtDate(t.lastDone) : '<span class="na">מעולם לא</span>';
            const next = t.nextDue ? fmtDate(t.nextDue) : '<span class="na">מיידי</span>';
            const status = t.overdue
              ? '<span class="pill red">' + (t.lastDone ? `באיחור ${Math.abs(t.daysUntil)} ימים` : 'טרם בוצע') + '</span>'
              : (t.daysUntil <= 30 ? `<span class="pill amber">בעוד ${t.daysUntil} ימים</span>` : `<span class="pill ok">בעוד ${t.daysUntil} ימים</span>`);
            return `<tr><td>${esc(t.task)}</td><td>${esc(freq)}</td><td>${last}</td><td>${next}</td><td>${status}</td></tr>`;
          }).join('');
          block += '</tbody></table>';
          return block;
        }).join('');
        if (mnt.skipped) html += `<p class="sub">${mnt.skipped} שורות תוכנית לא תקינות דולגו (בדוק id/משימה/תדירות/בית בגיליון MaintenancePlan).</p>`;
      }

      // Compliance (עמידה באמות מידה) — computed server-side from the Compliance sheet. Per house,
      // worst-first: expired first, then soonest-to-expire, with a doc link when present. A house with
      // no compliance row shows "לא הוגדרו פריטי אמות מידה" (never a fabricated 0). status is derived.
      const cmp = m.compliance;
      html += '<h2>עמידה באמות מידה</h2>';
      if (!cmp || !cmp.houses) {
        html += '<div class="unavail"><div class="t">עמידה באמות מידה — לא זמין</div><div class="r">אין נתוני אמות מידה</div></div>';
      } else if (!cmp.houses.length) {
        html += '<div class="kpi"><div class="n na">אין נתונים</div><div class="l">אין בתים פעילים</div></div>';
      } else {
        html += cmp.houses.map((h) => {
          const badges = `${h.expiredCount ? ` <span class="pill red">${h.expiredCount} פג תוקף</span>` : ''}${h.expiringCount ? ` <span class="pill amber">${h.expiringCount} פג בקרוב</span>` : ''}`;
          let block = `<h3 style="margin:14px 0 6px">${esc(h.house)}${badges}</h3>`;
          if (!h.defined) {
            block += '<div class="unavail" style="margin-bottom:4px"><div class="r">לא הוגדרו פריטי אמות מידה לבית זה.</div></div>';
            return block;
          }
          block += '<table><thead><tr><th>פריט</th><th>תוקף עד</th><th>ימים לתפוגה</th><th>סטטוס</th><th>מסמך</th></tr></thead><tbody>';
          block += h.items.map((it) => {
            const days = it.daysToExpiry == null ? '—' : (it.daysToExpiry < 0 ? `−${Math.abs(it.daysToExpiry)}` : it.daysToExpiry);
            const status = it.expired ? `<span class="pill red">${esc(it.status)}</span>`
              : (it.expiring ? `<span class="pill amber">${esc(it.status)}</span>` : `<span class="pill ok">${esc(it.status)}</span>`);
            const doc = it.docUrl ? `<a href="${esc(it.docUrl)}" target="_blank" rel="noopener">מסמך</a>` : '<span class="na">—</span>';
            return `<tr><td>${esc(it.item)}</td><td>${fmtDate(it.expires)}</td><td>${days}</td><td>${status}</td><td>${doc}</td></tr>`;
          }).join('');
          block += '</tbody></table>';
          return block;
        }).join('');
        if (cmp.skipped) html += `<p class="sub">${cmp.skipped} שורות אמות מידה לא תקינות דולגו (בדוק id/פריט/תאריך תוקף/בית בגיליון Compliance).</p>`;
      }

      // Exceptional events (אירועים חריגים) — computed server-side from the Events register. Open events
      // worst-first per house, recurrence (same type+house ≥2 in 90 days), monthly trend, missing lessons.
      // A house with no open events shows "אין אירועים" — a TRUE zero (the register is always available).
      const evt = m.events;
      html += '<h2>אירועים חריגים</h2>';
      if (!evt || !evt.available) {
        html += '<div class="unavail"><div class="t">אירועים חריגים — לא זמין</div><div class="r">אין נתוני אירועים</div></div>';
      } else {
        html += '<div class="grid" style="margin-bottom:10px">';
        html += kpi(evt.openCount || 0, 'אירועים פתוחים', (evt.openCount ? 'amber' : 'ok'));
        html += kpi((evt.recurrence || []).length, 'דפוסים חוזרים', ((evt.recurrence || []).length ? 'red' : 'ok'), (evt.recurrence || []).length > 0);
        html += kpi(evt.missingLessonsCount || 0, 'ללא הפקת לקחים', (evt.missingLessonsCount ? 'amber' : 'ok'));
        html += '</div>';

        // Recurrence — the JD success metric (ירידה באירועים חוזרים).
        if ((evt.recurrence || []).length) {
          html += '<h3 style="margin:12px 0 6px">אירועים חוזרים (אותו סוג + בית, 90 יום)</h3><table><thead><tr><th>בית</th><th>סוג</th><th>מופעים</th></tr></thead><tbody>';
          html += evt.recurrence.map((r) => `<tr><td>${esc(r.houseName || r.house)}</td><td>${esc(r.type)}</td><td><span class="pill red">${r.count}</span></td></tr>`).join('');
          html += '</tbody></table>';
        }

        // Per-house open events, worst-first; a house with none → "אין אירועים" (true zero).
        html += (evt.houses || []).map((h) => {
          let block = `<h3 style="margin:14px 0 6px">${esc(h.house)}${h.openCount ? ` <span class="pill amber">${h.openCount} פתוחים</span>` : ''}</h3>`;
          if (!h.hasEvents) { block += '<div class="kpi"><div class="n na">אין אירועים</div></div>'; return block; }
          block += '<table><thead><tr><th>תאריך</th><th>סוג</th><th>חומרה</th><th>סטטוס</th><th>תיאור</th><th>לקחים</th></tr></thead><tbody>';
          block += h.events.map((e) => {
            const sev = e.severity === 'גבוה' ? 'red' : (e.severity === 'בינוני' ? 'amber' : 'ok');
            const lessons = e.missingLessons ? '<span class="pill amber">חסר</span>' : '✓';
            return `<tr><td>${fmtDate(e.occurred)}</td><td>${esc(e.type)}</td><td><span class="pill ${sev}">${esc(e.severity || '—')}</span></td><td>${esc(e.status)}</td><td>${esc(e.description)}</td><td>${lessons}</td></tr>`;
          }).join('');
          block += '</tbody></table>';
          return block;
        }).join('');

        // Monthly trend (last 6 months).
        if ((evt.trend || []).length) {
          html += '<h3 style="margin:14px 0 6px">מגמה חודשית (6 חודשים)</h3><table><thead><tr><th>חודש</th><th>אירועים</th></tr></thead><tbody>';
          html += evt.trend.map((t) => `<tr><td>${esc(t.month)}</td><td>${t.count}</td></tr>`).join('');
          html += '</tbody></table>';
        }
        if (evt.skipped) html += `<p class="sub">${evt.skipped} שורות אירועים לא תקינות דולגו (בדוק id/בית/תאריך בגיליון Events).</p>`;
      }

      html += '<h2>מדדים ללא מקור נתונים (לא מוצגים כאפס)</h2>';
      html += UNAVAILABLE.map(([t, r]) => `<div class="unavail" style="margin-bottom:8px"><div class="t">${esc(t)} — לא זמין</div><div class="r">${esc(r)}</div></div>`).join('');

      document.getElementById('out').innerHTML = html;
    }

    // Month selector re-requests the same screen for the chosen budget month (server recomputes).
    window.loadMonth = (period) => load(period);

    async function load(period) {
      try {
        const res = await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'managementData', token: window.__STAFF_TOKEN__ || '', payload: period ? { period } : {} }) });
        if (res.status === 403) { document.getElementById('out').innerHTML = '<div class="deny">אין הרשאה לצפייה במסך זה. המסך פתוח למנהלת התפעול ולמנכ״לית בלבד.</div>'; return; }
        const j = await res.json();
        if (!j || !j.ok) {
          if (j && /forbidden/i.test(j.error || '')) { document.getElementById('out').innerHTML = '<div class="deny">אין הרשאה לצפייה במסך זה.</div>'; return; }
          throw new Error((j && j.error) || 'load failed');
        }
        render(build(j.data || {}, Date.now()));
      } catch (e) {
        document.getElementById('out').innerHTML = '<p class="empty">שגיאה בטעינה. רענן/י ונסה/י שוב.</p>';
      }
    }
    load();
  </script>
</body>
</html>
