<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EZone לוגיסטיקה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* EZone Logistics — dark family theme, Logistics signature teal. This is the root/login landing:
       the auth shim (injected by the Node frontend) owns the login overlay + version footer; once a
       manager is signed in the page forwards to /dashboard. It carries NO request-submission form —
       coordinators file from the external ezone-coordinators app, managers from the dashboard modal. */
    :root {
      --bg: #15171c;
      --bg2: #1b1e24;
      --card: #1f232b;
      --card-line: #333a45;
      --ink: #eef1f5;
      --muted: #8b93a0;
      --accent: #2dd4bf;
      --accent-2: #5eead4;
      --accent-grad: linear-gradient(120deg, #14b8a6 0%, #2dd4bf 50%, #5eead4 100%);
      --glow: rgba(45,212,191,.45);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background:
        radial-gradient(1100px 480px at 82% -12%, #262b36 0%, transparent 58%),
        var(--bg);
      font-family: 'Heebo', "Segoe UI", system-ui, -apple-system, Arial, sans-serif; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--card-line);
      background: linear-gradient(180deg, var(--bg2), transparent);
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .02em; font-size: 1.05rem; white-space: nowrap; }
    .brand-emblem { width: 30px; height: 30px; flex: 0 0 auto; display: block; }
    .brand-name { color: var(--ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 64px; }
    header h1 {
      font-size: 1.6rem; font-weight: 800; margin: 6px 0 2px; letter-spacing: -.01em;
      color: #ffffff; width: fit-content;
    }
    header p { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
    .card {
      position: relative; background: var(--card);
      border: 1px solid transparent; border-radius: var(--radius); padding: 22px 19px;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        var(--accent-grad) border-box;
      box-shadow: 0 0 0 1px rgba(170,178,190,.05), 0 0 34px -6px var(--glow), 0 18px 40px rgba(0,0,0,.4);
    }
    .card p { margin: 0 0 12px; color: var(--muted); }
    .card a.go {
      display: inline-block; font-weight: 800; text-decoration: none; color: #06201c;
      background: var(--accent-grad); border-radius: 12px; padding: 12px 20px;
    }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { font-size: .92rem; font-weight: 700; color: #c8cdd6; text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid transparent; transition: all .12s; }
    .nav a:hover { color: var(--ink); border-color: var(--card-line); }
    .nav a.active { font-weight: 800; color: #14171c; background: var(--accent-grad); }

    /* ── Mobile responsive (≤640px): two-row topbar, ≥40px touch targets, iOS no-zoom.
       RTL preserved: logical properties only. */
    @media (max-width: 640px) {
      /* hard-disable horizontal panning on Android — content already fits, nothing gets cut */
      html, body { overflow-x: hidden; max-width: 100vw; }
      .topbar { flex-wrap: wrap; gap: 10px; }
      .brand-emblem { width: 28px; height: 28px; }
      .nav {
        order: 2; flex-basis: 100%; width: 100%;
        flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; -ms-overflow-style: none;
        margin-block-start: 2px; padding-block-end: 2px;
      }
      .nav::-webkit-scrollbar { display: none; }
      .nav a { flex: 0 0 auto; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; padding-block: 9px; }
      .wrap { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <nav class="nav"><a href="/dashboard">דשבורד</a></nav>
    <div class="brand"><img class="brand-emblem" src="/icon-v1-192.png" alt="" /><span class="brand-name">לוגיסטיקה</span></div>
  </div>
  <div class="wrap">
    <header>
      <h1>לוגיסטיקה</h1>
      <p>מערכת ניהול לוגיסטיקה, רכש ותחזוקה</p>
    </header>

    <div class="card">
      <p>מתחבר/ת…</p>
      <a class="go" href="/dashboard">מעבר לדשבורד</a>
    </div>
  </div>

  <script>
    // '/' is the managers-only login landing. It holds NO request-submission surface: coordinators file
    // requests from the external ezone-coordinators app (server-to-server into the secret-gated intake),
    // and managers file from the in-dashboard create modal. This page's only job is to bring an
    // unauthenticated visitor to the login overlay, then forward a signed-in manager to the dashboard.
    const EXEC_URL = window.__EXEC_URL__ || '__EXEC_URL__';

    // The injected auth shim wraps fetch(): a /api/exec call triggers the login overlay when there is no
    // session and resolves only once authenticated. We issue one harmless read purely to drive that flow,
    // then forward to /dashboard. If the read fails for any reason we still forward — the dashboard's own
    // shim re-checks auth. A visitor who cannot log in stays on the overlay (the promise never resolves).
    (function () {
      function toDashboard() { try { location.replace('/dashboard'); } catch (e) {} }
      fetch(EXEC_URL + '?action=houses').then(toDashboard, toDashboard);
    })();
  </script>
  <script>
    // PWA: register the service worker so the app is installable to the home
    // screen and opens standalone. Guarded — a failed registration must never
    // break the page.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
