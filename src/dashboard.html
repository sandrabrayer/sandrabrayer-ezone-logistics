<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EZone לוגיסטיקה — דשבורד</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #15171c; --bg2: #1b1e24; --card: #1f232b; --card-line: #333a45;
      --ink: #eef1f5; --muted: #8b93a0;
      --accent: #2dd4bf; --accent-2: #5eead4;
      --accent-grad: linear-gradient(120deg, #14b8a6 0%, #2dd4bf 50%, #5eead4 100%);
      --accent-soft: rgba(45,212,191,.12); --glow: rgba(45,212,191,.45);
      --go: #14b8a6; --go-press: #0f9488; --amber: #e0a23a; --red: #e0584a;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background: radial-gradient(1100px 480px at 82% -12%, #262b36 0%, transparent 58%), var(--bg);
      font-family: 'Heebo', "Segoe UI", system-ui, -apple-system, Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--card-line);
      background: linear-gradient(180deg, var(--bg2), transparent);
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .02em; font-size: 1.05rem; white-space: nowrap; }
    .brand-emblem { width: 30px; height: 30px; flex: 0 0 auto; display: block; }
    .brand-name { color: var(--ink); }
    .tab { font-size: .85rem; font-weight: 800; color: #14171c; padding: 8px 18px; border-radius: 999px; border: none; background: var(--accent-grad); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 64px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin: 6px 0 4px; color: #ffffff; letter-spacing: -.01em; width: fit-content; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
    /* identity + filters bar */
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .controls label { font-size: .8rem; color: #e8ecf2; font-weight: 600; margin-inline-end: 4px; }
    select { font-family: inherit; font-size: .92rem; color: var(--ink); background: #161a20; border: 1.5px solid var(--card-line); border-radius: 10px; padding: 9px 11px; }
    select:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
    select option { background: #161a20; color: var(--ink); }
    /* attention / notifications panel */
    .attention { background: linear-gradient(var(--card),var(--card)) padding-box, var(--accent-grad) border-box; border: 1px solid transparent; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; box-shadow: 0 0 30px -12px var(--glow); }
    .attention h2 { font-size: 1.2rem; font-weight: 800; color: #ffffff; letter-spacing: -.01em; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .attention .who { color: var(--muted); font-weight: 500; font-size: .85rem; }
    .attn-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .92rem; }
    .attn-item:last-child { border-bottom: none; }
    .attn-badge { font-size: .78rem; font-weight: 800; min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0 7px; }
    .attn-badge.act { background: var(--accent-soft); color: var(--accent-2); }
    .attn-badge.warn { background: rgba(224,162,58,.16); color: var(--amber); }
    .attn-badge.due { background: rgba(224,88,74,.16); color: var(--red); }
    .attn-none { color: var(--muted); font-size: .9rem; }
    /* summary counters */
    .counters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .counter { flex: 1; min-width: 130px; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius); padding: 14px 16px; }
    .counter .n { font-size: 1.8rem; font-weight: 800; color: var(--accent-2); }
    .counter .l { font-size: .82rem; color: var(--muted); }
    /* status column groups */
    .group { margin-bottom: 26px; }
    .group h2 { font-size: 1.2rem; font-weight: 800; color: #ffffff; letter-spacing: -.01em; margin: 0 0 10px; display: flex; align-items: center; gap: 9px; }
    .group h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .req {
      background: var(--card);
      background: linear-gradient(var(--card), var(--card)) padding-box, var(--accent-grad) border-box;
      border: 1px solid transparent; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 0 26px -10px var(--glow);
    }
    .req .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .req .title { font-weight: 700; }
    .req .meta { color: var(--muted); font-size: .82rem; margin-top: 3px; }
    .req .cost { font-weight: 800; color: var(--accent-2); white-space: nowrap; }
    .pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
    .pill.urgent { background: rgba(224,162,58,.14); color: var(--amber); }
    .pill.emergency { background: rgba(224,88,74,.16); color: var(--red); }
    .pill.normal { background: var(--accent-soft); color: var(--accent-2); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button.act { font-family: inherit; font-size: .85rem; font-weight: 700; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--card-line); background: #161a20; color: var(--ink); cursor: pointer; transition: all .12s; }
    button.act:hover { border-color: var(--accent-2); }
    button.act.go { background: var(--go); color: #06201c; border: none; }
    button.act.go:hover { background: var(--go-press); }
    button.act.danger { color: var(--red); border-color: rgba(224,88,74,.4); }
    button.act:disabled { opacity: .4; cursor: default; }
    /* in-flight state — same pattern as the #79 login button (server.js setLoading): keep the
       button readable (not dimmed) while its POST runs so the spinner reads clearly. */
    button.act.busy, button.act.busy:disabled { opacity: 1; cursor: default; }
    .act-spin { display: inline-block; width: 13px; height: 13px; box-sizing: border-box; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; vertical-align: middle; animation: act-spin .6s linear infinite; }
    @keyframes act-spin { to { transform: rotate(360deg); } }
    .empty { color: var(--muted); font-size: .9rem; padding: 8px 2px; }
    .msg { padding: 11px 14px; border-radius: 10px; font-weight: 600; margin-bottom: 16px; display: none; }
    .msg.ok { display: block; background: rgba(45,212,191,.12); color: var(--accent-2); border: 1px solid rgba(45,212,191,.35); }
    .msg.err { display: block; background: rgba(224,88,74,.1); color: #ef8478; border: 1px solid rgba(224,88,74,.35); }
    .loading { color: var(--muted); }
    @media (max-width: 600px) { .counter { min-width: 45%; } }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { font-size: .92rem; font-weight: 700; color: #c8cdd6; text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid transparent; transition: all .12s; }
    .nav a:hover { color: var(--ink); border-color: var(--card-line); }
    .nav a.active { font-weight: 800; color: #14171c; background: var(--accent-grad); }
    /* Deferral modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 22px; width: 320px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal-title { margin: 0 0 16px; font-size: 1.1rem; color: var(--accent-2); }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
    .modal-field input, .modal-field select, .modal-field textarea { width: 100%; font-family: inherit; font-size: 1rem; color: var(--ink); background: #161a20; border: 1.5px solid var(--card-line); border-radius: 10px; padding: 10px 12px; box-sizing: border-box; }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { outline: none; border-color: var(--accent-2); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .modal-hint { color: var(--muted); font-size: .78rem; margin-top: 5px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }

    /* ── Mobile responsive (≤640px) — step 1: two-row topbar, ≥40px touch targets, iOS no-zoom.
       Fully scoped to this media query so the desktop layout stays pixel-identical.
       RTL preserved: logical properties (padding-block / margin-block) only, no left/right. */
    @media (max-width: 640px) {
      /* hard-disable horizontal panning on Android — content already fits, nothing gets cut */
      html, body { overflow-x: hidden; max-width: 100vw; }
      /* topbar wraps: brand (+ .tab) on top, .nav on its own scrollable row below */
      .topbar { flex-wrap: wrap; gap: 10px; }
      .brand-emblem { width: 28px; height: 28px; }
      .nav {
        order: 2; flex-basis: 100%; width: 100%;
        flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; -ms-overflow-style: none;
        margin-block-start: 2px; padding-block-end: 2px;
      }
      .nav::-webkit-scrollbar { display: none; }
      .nav a { flex: 0 0 auto; white-space: nowrap; }
      /* ≥40px touch targets */
      .nav a, .tab { min-height: 40px; display: inline-flex; align-items: center; padding-block: 9px; }
      button, select, input { min-height: 40px; }
      /* 16px form fields prevent iOS focus zoom */
      input, select, textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <script>
    // Auth is handled by the injected login overlay (increment 30): identity login (name + PIN)
    // yields an HMAC session token sent as Authorization: Bearer on every /api call. staffGate()
    // below is a retained no-op so the existing load flow is untouched.
    async function staffGate() {
      // Auth is handled by the injected login overlay (increment 30): identity login
      // (name + PIN) → HMAC session token, sent as Authorization: Bearer on every /api call.
      return;
    }
  </script>

  <div class="topbar">
    <nav class="nav"><a href="/dashboard" class="active">דשבורד</a><a href="/workorders">משימות פתוחות וסטטוס</a><a href="/inventory">מלאי</a><a href="/inspection">בקרה</a><a href="/reports">דוחות</a></nav>
    <div class="brand"><img class="brand-emblem" src="/icon-v1-192.png" alt="" /><span class="brand-name">לוגיסטיקה</span></div>
  </div>
  <div class="wrap">
    <h1>דשבורד</h1>
    <p class="sub">ניהול דרישות — אישור, העברה ומעקב</p>

    <div class="controls">
      <span><label>משתמש:</label>
        <select id="who">
          <option value="רועי">רועי</option>
        </select>
      </span>
      <span><label>בית:</label>
        <select id="filterHouse"><option value="">כל הבתים</option></select>
      </span>
      <span><label>אחראי:</label>
        <select id="filterLead">
          <option value="">הכל</option>
          <option value="רמי">רמי</option>
          <option value="צחי">צחי</option>
        </select>
      </span>
      <span><button class="act go" id="openCreate" type="button">＋ דרישה חדשה</button></span>
    </div>

    <div class="msg" id="msg"></div>
    <div id="attention"></div>
    <div class="counters" id="counters"></div>
    <div id="board"><p class="loading">טוען דרישות…</p></div>
  </div>

  <!-- Deferral modal: calendar date picker + reminder-days-before -->
  <!-- In-dashboard create (nav cleanup): managers file requests here — the standalone דרישה חדשה page is gone.
       created_by is set server-side from the session token; the house list comes from the loaded allHouses. -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-box">
      <h3 class="modal-title">דרישה חדשה</h3>
      <div class="modal-field">
        <label for="crHouse">בית</label>
        <select id="crHouse"><option value="" disabled selected>בחר/י בית…</option></select>
      </div>
      <div class="modal-field">
        <label for="crCategory">קטגוריה</label>
        <select id="crCategory">
          <option value="" disabled selected>בחר/י…</option>
          <option value="רכישה">רכישה</option>
          <option value="תיקון">תיקון</option>
          <option value="החלפה">החלפה</option>
        </select>
      </div>
      <div class="modal-field">
        <label for="crUrgency">דחיפות</label>
        <select id="crUrgency">
          <option value="רגיל" selected>רגיל</option>
          <option value="דחוף">דחוף</option>
          <option value="חירום">חירום</option>
        </select>
      </div>
      <div class="modal-field">
        <label for="crDescription">תיאור</label>
        <input type="text" id="crDescription" placeholder="מה צריך לרכוש / לתקן / להחליף?" />
      </div>
      <div class="modal-field">
        <label for="crLocation">מיקום בבית <span style="color:var(--muted);font-weight:500">(לא חובה)</span></label>
        <input type="text" id="crLocation" placeholder="למשל: מטבח, חדר 4, גינה" />
      </div>
      <div class="modal-actions">
        <button class="act" id="crCancel" type="button">ביטול</button>
        <button class="act go" id="crConfirm" type="button">שליחת דרישה</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deferModal">
    <div class="modal-box">
      <h3 class="modal-title">דחיית דרישה לתאריך</h3>
      <div class="modal-field">
        <label for="deferDate">דחה עד תאריך</label>
        <input type="date" id="deferDate" />
      </div>
      <div class="modal-field">
        <label for="deferRemind">תזכורת כמה ימים לפני</label>
        <input type="number" id="deferRemind" min="0" step="1" value="7" />
        <div class="modal-hint" id="remindHint"></div>
      </div>
      <div class="modal-actions">
        <button class="act" id="deferCancel">ביטול</button>
        <button class="act go" id="deferConfirm">אישור דחייה</button>
      </div>
    </div>
  </div>

  <!-- Refer / assign modal: internal lead (auto by house) vs external trade -->
  <div class="modal-overlay" id="referModal">
    <div class="modal-box">
      <h3 class="modal-title">להעביר דרישה</h3>
      <div class="modal-field">
        <label>סוג העברה</label>
        <div class="seg" style="display:flex;gap:8px">
          <label style="flex:1;text-align:center;padding:8px;border:1.5px solid var(--card-line);border-radius:9px;cursor:pointer"><input type="radio" name="referType" value="internal" checked style="position:absolute;opacity:0">אחראי בית (פנימי)</label>
          <label style="flex:1;text-align:center;padding:8px;border:1.5px solid var(--card-line);border-radius:9px;cursor:pointer"><input type="radio" name="referType" value="external" style="position:absolute;opacity:0">בעל מקצוע (חיצוני)</label>
        </div>
      </div>
      <div class="modal-field" id="referInternalField">
        <label for="referLeadSel">אחראי הבית</label>
        <select id="referLeadSel"></select>
        <div class="modal-hint" id="referLeadHint">ברירת המחדל היא אחראי הבית — ניתן לשנות לרמי / צחי / רועי</div>
      </div>
      <div class="modal-field" id="referExternalField" style="display:none">
        <label for="referTrade">בעל מקצוע</label>
        <select id="referTrade"></select>
        <label style="margin-top:10px"><input type="checkbox" id="referMarkOnly" style="width:auto;margin-inline-end:6px">רק לסמן לאיגום עתידי (לא להעביר עכשיו)</label>
      </div>
      <div class="modal-actions">
        <button class="act" id="referCancel">ביטול</button>
        <button class="act go" id="referConfirm">העבר</button>
      </div>
    </div>
  </div>

  <script>
    const EXEC_URL = window.__EXEC_URL__ || '__EXEC_URL__';
    const THRESHOLD_DEFAULT = 3000;

    const ST = {
      REQUEST: 'דרישה', PENDING: 'ממתין לאישור', APPROVED: 'מאושר',
      NOT_APPROVED: 'לא מאושר', DEFERRED: 'נדחה לתאריך', IN_PROGRESS: 'בביצוע',
      COMPLETED: 'הושלם', CLOSED: 'סגור',
    };
    // Display order of status groups on the board.
    const GROUPS = [
      { key: 'pending', title: 'ממתין לאישור', statuses: [ST.REQUEST, ST.PENDING], color: '#2dd4bf' },
      { key: 'deferred', title: 'נדחה לתאריך', statuses: [ST.DEFERRED], color: '#e0a23a' },
      { key: 'approved', title: 'מאושר — להעברה לביצוע', statuses: [ST.APPROVED], color: '#60a5fa' },
      { key: 'inprogress', title: 'בביצוע', statuses: [ST.IN_PROGRESS], color: '#34d399' },
      { key: 'done', title: 'הושלם / סגור', statuses: [ST.COMPLETED, ST.CLOSED], color: '#8b93a0' },
      { key: 'rejected', title: 'לא מאושר', statuses: [ST.NOT_APPROVED], color: '#e0584a' },
    ];

    let allRequests = [];
    let allFindings = [];
    let allInspections = [];
    let allHouses = [];
    let threshold = THRESHOLD_DEFAULT;
    const msg = document.getElementById('msg');
    const board = document.getElementById('board');

    function showMsg(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; setTimeout(() => { if (kind === 'ok') msg.className = 'msg'; }, 4000); }
    function who() { return document.getElementById('who').value; }
    function blank(c) { return c === '' || c === null || c === undefined; }
    function num(c) { return blank(c) ? null : Number(c); }

    // Mirror of chain B (src/approval.js / Code.gs whoApproves): emergency → 'auto' (no human approver);
    // over the approval threshold → 'ops_manager' (Olga); otherwise → 'field_ops' (Roy). The SERVER is the
    // authority — this drives the UI so Roy is never shown an approve button that would 403 above the threshold.
    function whoApproves(cost, urgency) {
      if (urgency === 'חירום') return 'auto';
      if (cost !== '' && cost != null && Number(cost) > Number(threshold)) return 'ops_manager';
      return 'field_ops';
    }
    function sessionRole() { return String(window.__ROLE__ || ''); }
    function isExecUI() { return sessionRole() === 'ops_manager' || sessionRole() === 'ceo'; }
    // Mirror of Code.gs actorMayApprove_ for the SESSION role: emergency (auto) → any dispatch-capable role;
    // otherwise only the exact chain-B role, or the ceo. Governs whether אישור / לא אושר are shown or replaced.
    function canApproveUI(r) {
      const req = whoApproves(r.estimated_cost, r.urgency);
      const role = sessionRole();
      if (req === 'auto') return ['field_ops', 'ops_manager', 'ceo'].includes(role);
      if (role === 'ceo') return true;
      return role === req;
    }

    async function load() {
      try {
        // ONE aggregated call for the whole page (perf round-2). Server enforces the SAME role gate +
        // scoping as the individual reads; config comes back as its key→value object.
        const j = await fetch(EXEC_URL + '?action=pageData&page=dashboard').then(r => r.json());
        if (!j.ok) throw new Error(j.error || 'load failed');
        const d = j.data || {};
        allRequests = d.requests || [];
        allFindings = d.findings || [];
        allInspections = d.inspections || [];
        if (d.config && d.config.approval_threshold != null) {
          threshold = Number(d.config.approval_threshold);
        }
        allHouses = d.houses || [];
        const sel = document.getElementById('filterHouse');
        allHouses.forEach(h => { const o = document.createElement('option'); o.value = h.name; o.textContent = h.name; sel.appendChild(o); });
        render();
      } catch (e) {
        board.innerHTML = '<p class="empty">שגיאה בטעינת הדרישות. רענן/י ונסה/י שוב.</p>';
        showMsg('err', 'לא ניתן לטעון את הדרישות.');
      }
    }

    function filtered() {
      const h = document.getElementById('filterHouse').value;
      const lead = document.getElementById('filterLead').value;
      return allRequests.filter(r => (!h || r.house === h) && (!lead || r.assigned_to === lead));
    }

    function render() {
      const reqs = filtered();
      renderAttention(reqs);
      // counters
      const open = reqs.filter(r => ![ST.CLOSED, ST.NOT_APPROVED, ST.COMPLETED].includes(r.status)).length;
      const pending = reqs.filter(r => [ST.REQUEST, ST.PENDING].includes(r.status)).length;
      const deferred = reqs.filter(r => r.status === ST.DEFERRED).length;
      const closed = reqs.filter(r => [ST.CLOSED, ST.COMPLETED].includes(r.status)).length;
      document.getElementById('counters').innerHTML = [
        ['פתוחות', open], ['ממתין לאישור', pending], ['נדחו', deferred], ['הושלמו/נסגרו', closed],
      ].map(([l, n]) => `<div class="counter"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      const nowMs = Date.now();
      board.innerHTML = renderBatchSuggestions() + renderHouseConsolidation() + (GROUPS.map(g => {
        const items = reqs.filter(r => g.statuses.includes(r.status)).sort((a, b) => agingSort(a, b, nowMs));
        if (items.length === 0) return '';
        return `<div class="group"><h2><span class="dot" style="background:${g.color}"></span><span style="border-inline-start:4px solid ${g.color};padding-inline-start:8px">${g.title}</span> <span style="color:var(--muted);font-weight:500">(${items.length})</span></h2>${items.map(r => card(r, g.color)).join('')}</div>`;
      }).join('') || '<p class="empty">אין דרישות להצגה.</p>');
    }

    // Per-user attention panel: what the logged-in user needs to act on.
    function renderAttention(reqs) {
      const u = who();
      const today = new Date().toISOString().slice(0, 10);
      const items = [];

      // Requests awaiting THIS SESSION's approval (chain B). Emergency (auto) needs no human approver, and a
      // request routed above this role's tier (e.g. an over-threshold request for field_ops) is NOT theirs.
      const awaiting = reqs.filter(r => {
        if (![ST.REQUEST, ST.PENDING, ST.DEFERRED].includes(r.status)) return false;
        if (whoApproves(r.estimated_cost, r.urgency) === 'auto') return false;
        return canApproveUI(r);
      });
      if (awaiting.length) items.push(['act', awaiting.length, 'דרישות ממתינות לאישורך']);

      // New requests (status דרישה) — Roy should act / route them.
      if (u === 'רועי') {
        const fresh = reqs.filter(r => r.status === ST.REQUEST);
        if (fresh.length) items.push(['act', fresh.length, 'דרישות חדשות שהתקבלו']);
      }

      // Deferral reminders due today (or overdue).
      const dueDefers = reqs.filter(r => r.status === ST.DEFERRED && r.deferred_until && r.deferred_until <= today);
      if (dueDefers.length) items.push(['due', dueDefers.length, 'תזכורות דחייה שהגיע מועדן']);

      // Pending inspection defects awaiting confirmation into a request (Roy acts).
      if (u === 'רועי') {
        const pendingDefects = allFindings.filter(f => f.finding_type === 'physical_defect' && !f.linked_request_id);
        if (pendingDefects.length) items.push(['warn', pendingDefects.length, 'ליקויים מבקרות לאישור לדרישה']);
      }

      document.getElementById('attention').innerHTML = `<div class="attention">
        <h2>🔔 דורש את תשומת לבך <span class="who">— ${escapeHtml(u)}</span></h2>
        ${items.length
          ? items.map(([k, n, t]) => `<div class="attn-item"><span class="attn-badge ${k}">${n}</span>${t}</div>`).join('')
          : '<div class="attn-none">אין פעולות הממתינות לך כרגע ✓</div>'}
      </div>`;
    }

    // Clean Hebrew date (no ISO timestamp). Accepts "2026-06-13" or a full ISO string.
    function fmtDate(v) {
      if (!v) return '';
      const s = String(v).slice(0, 10);
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return escapeHtml(String(v));
      return `${m[3]}/${m[2]}/${m[1]}`;
    }

    // ── SLA / aging (increment 36) — mirror of src/sla.js (read-only view; the server is the gate).
    function isBlockedUI(r) { return String(r.blocked == null ? '' : r.blocked).toUpperCase() === 'TRUE'; }
    function isOverdueUI(r, now) {
      if (!r.due_at) return false;
      if (r.status === ST.COMPLETED || r.status === ST.CLOSED || r.status === ST.DEFERRED) return false;
      const due = new Date(r.due_at).getTime();
      return !isNaN(due) && (now || Date.now()) > due;
    }
    function daysOverdueUI(r, now) {
      if (!isOverdueUI(r, now)) return 0;
      return Math.floor(((now || Date.now()) - new Date(r.due_at).getTime()) / 86400000);
    }
    // Worst-first: overdue (by days overdue) first, then blocked, then more-urgent, then oldest.
    const URGENCY_WEIGHT = { 'חירום': 3, 'דחוף': 2, 'רגיל': 1 };
    function agingSort(a, b, now) {
      const oa = isOverdueUI(a, now), ob = isOverdueUI(b, now);
      if (oa !== ob) return oa ? -1 : 1;
      if (oa && ob) { const d = daysOverdueUI(b, now) - daysOverdueUI(a, now); if (d) return d; }
      const ba = isBlockedUI(a), bb = isBlockedUI(b);
      if (ba !== bb) return ba ? -1 : 1;
      const uw = (URGENCY_WEIGHT[b.urgency] || 0) - (URGENCY_WEIGHT[a.urgency] || 0);
      if (uw) return uw;
      return String(a.created_at).localeCompare(String(b.created_at));  // oldest first
    }
    // Is the logged-in user a manager tier (field_ops / ops_manager / ceo) — may block/unblock.
    function canBlockUI() {
      return ['field_ops', 'ops_manager', 'ceo'].includes(String(window.__ROLE__ || ''));
    }

    // Per-house consolidation of open inspection defects (ליקויים פתוחים), de-duplicated by text,
    // honoring the current house filter. This centralizes faults per house so the same broken
    // item isn't opened twice. Each row links straight to opening a request.
    // Smart batching: approved EXTERNAL requests sharing trade × cluster → suggest one visit.
    // A request becomes batchable once Roy marks it external + a trade (status stays מאושר).
    function renderBatchSuggestions() {
      const cluster = {};
      allHouses.forEach(h => { if (h && h.name) cluster[h.name] = h.cluster || ''; });
      const groups = {};
      allRequests.forEach(r => {
        if (r.status !== ST.APPROVED || r.assignment_type !== 'external' || !r.trade || r.batch_id) return;
        const cl = cluster[r.house] || '';
        if (!cl) return;
        const key = r.trade + '|' + cl;
        (groups[key] = groups[key] || { trade: r.trade, cluster: cl, reqs: [] }).reqs.push(r);
      });
      const batches = Object.values(groups).filter(g => g.reqs.length >= 2)
        .sort((a, b) => b.reqs.length - a.reqs.length);
      if (batches.length === 0) return '';
      const clusterHe = { sharon: 'שרון', caesarea: 'קיסריה', north: 'צפון' };
      const blocks = batches.map(b => {
        const ids = b.reqs.map(r => r.id);
        const rows = b.reqs.map(r => `<div class="attn-item"><span>${escapeHtml(r.house)} · ${escapeHtml(r.description || r.id)}</span></div>`).join('');
        return `<div style="margin-bottom:12px">
          <div class="rollup-house-name" style="font-weight:800;margin-bottom:6px">${escapeHtml(b.trade)} · ${clusterHe[b.cluster] || escapeHtml(b.cluster)} <span class="pill normal">${b.reqs.length} עבודות</span></div>
          ${rows}
          <button class="act go" style="margin-top:8px" onclick='doAssignBatch(${JSON.stringify(ids)}, ${JSON.stringify(b.trade)}, this)'>הקצה כביקור מרוכז</button>
        </div>`;
      }).join('');
      return `<div class="attention" style="background:linear-gradient(var(--card),var(--card)) padding-box, var(--accent-grad) border-box">
        <h2>🔗 הצעות לאיגום ביקורי טכנאי</h2>
        <p class="attn-none" style="margin:0 0 10px">דרישות חיצוניות מאושרות מאותו מקצוע ואותו אשכול — כדאי לאחד לביקור אחד.</p>
        ${blocks}
      </div>`;
    }
    window.doAssignBatch = (ids, trade, btn) => {
      if (!confirm(`להקצות ${ids.length} עבודות כביקור מרוכז אחד (${trade})?`)) return;
      post('assignBatch', { ids, by: who(), trade }, btn);
    };

    function renderHouseConsolidation() {
      const houseFilter = document.getElementById('filterHouse').value;
      const insById = {};
      allInspections.forEach(i => { if (i && i.id != null) insById[String(i.id)] = i; });
      const open = allFindings.filter(f =>
        f.finding_type === 'physical_defect' && !f.linked_request_id);
      if (open.length === 0) return '';

      // group: house -> normalized text -> {text, location, category, count, ids}
      const byHouse = {};
      open.forEach(f => {
        const ins = insById[String(f.inspection_id)];
        const house = ins ? ins.house : '';
        if (!house) return;
        if (houseFilter && house !== houseFilter) return;
        const key = String(f.finding_text || '').trim().replace(/\s+/g, ' ').toLowerCase();
        const bucket = (byHouse[house] = byHouse[house] || {});
        if (bucket[key]) { bucket[key].count++; bucket[key].ids.push(f.id); }
        else bucket[key] = { text: f.finding_text, location: f.location_in_house || '', category: f.suggested_category || 'תיקון', count: 1, ids: [f.id] };
      });
      const houses = Object.keys(byHouse).sort((a, b) => a.localeCompare(b, 'he'));
      if (houses.length === 0) return '';

      const blocks = houses.map(house => {
        const rows = Object.values(byHouse[house]).map(it => `
          <div class="attn-item" style="justify-content:space-between">
            <span>${it.location ? '<b>' + escapeHtml(it.location) + ':</b> ' : ''}${escapeHtml(it.text)}
              <span class="pill urgent">${escapeHtml(it.category)}</span>${it.count > 1 ? ' <span class="pill normal">×' + it.count + '</span>' : ''}</span>
            <button class="act go" onclick="doConfirmFinding('${it.ids[0]}', this)">פתח דרישה</button>
          </div>`).join('');
        return `<div style="margin-bottom:14px"><div class="rollup-house-name" style="font-weight:800;margin-bottom:6px">${escapeHtml(house)}</div>${rows}</div>`;
      }).join('');

      return `<div class="attention" style="background:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(120deg,#e0a23a,#f0c674) border-box">
        <h2>🛠 ריכוז ליקויים פתוחים לפי בית</h2>
        <p class="attn-none" style="margin:0 0 10px">ממצאים מבקרות שטרם נפתחה להם דרישה — מקובצים לפי בית, ללא כפילויות.</p>
        ${blocks}
      </div>`;
    }

    function urgencyPill(u) {
      if (u === 'חירום') return '<span class="pill emergency">חירום</span>';
      if (u === 'דחוף') return '<span class="pill urgent">דחוף</span>';
      return '<span class="pill normal">רגיל</span>';
    }

    // Overdue / blocked badges (increment 36) — visible at a glance on every card.
    function agingBadges(r) {
      const b = [];
      if (isOverdueUI(r)) {
        const d = daysOverdueUI(r);
        b.push(`<span class="pill emergency">באיחור${d ? ' · ' + d + ' ימים' : ''}</span>`);
      }
      if (isBlockedUI(r)) {
        b.push(`<span class="pill" style="background:#4a3410;color:#e0a23a">⛔ תקוע${r.blocked_reason ? ': ' + escapeHtml(String(r.blocked_reason)) : ''}</span>`);
      }
      return b.join(' ');
    }

    function card(r, color) {
      const meta = [r.house, r.category, r.created_by].filter(Boolean).join(' · ');
      const badges = agingBadges(r);
      const edge = isOverdueUI(r) ? '#e0584a' : (color || 'var(--card-line)');
      return `<div class="req" style="border-inline-start:4px solid ${edge}">
        <div class="head">
          <div>
            <div class="title">${escapeHtml(r.description || r.id)} ${urgencyPill(r.urgency)}${badges ? ' ' + badges : ''}</div>
            <div class="meta">${escapeHtml(meta)}${r.location_in_house ? ' · ' + escapeHtml(r.location_in_house) : ''}${r.deferred_until ? ' · נדחה ל-<span dir="ltr">' + fmtDate(r.deferred_until) + '</span>' : ''}</div>
            ${r.assigned_to ? `<div class="meta" style="color:var(--accent-2);font-weight:700;margin-top:4px">↩ הועבר ל: ${escapeHtml(r.assigned_to)}${r.assignment_type === 'external' ? ' (בעל מקצוע)' : ' (אחראי בית)'}${r.batch_id ? ' · 🔗 ביקור מרוכז' : ''}</div>` : (r.trade && r.assignment_type === 'external' ? `<div class="meta" style="color:var(--amber);font-weight:700;margin-top:4px">סומן ל: ${escapeHtml(r.trade)} — ממתין לאיגום</div>` : '')}
          </div>
        </div>
        <div class="actions">${actionsFor(r)}</div>
      </div>`;
    }

    function actionsFor(r) {
      const s = r.status, id = r.id;
      const btns = [];
      if ([ST.REQUEST, ST.PENDING, ST.DEFERRED].includes(s)) {
        if (canApproveUI(r)) {
          btns.push(`<button class="act go" onclick="doApprove('${id}', this)">אישור</button>`);
          btns.push(`<button class="act danger" onclick="doReject('${id}', this)">לא אושר</button>`);
        } else {
          // Over the approval threshold and this session may not approve it (field_ops → routed to Olga).
          // Show a clear, NON-clickable status instead of a button that would 403 on click.
          btns.push('<button class="act" disabled title="דרישה מעל סף האישור — טעונה אישור מנהלת התפעול (אולגה)">ממתין לאישור אולגה</button>');
        }
        btns.push(`<button class="act" onclick="doDefer('${id}')">דחה לתאריך</button>`);
      } else if (s === ST.APPROVED) {
        btns.push(`<button class="act go" onclick="doAssign('${id}')">הועבר לביצוע</button>`);
      } else if (s === ST.IN_PROGRESS) {
        btns.push(`<button class="act go" onclick="doComplete('${id}', this)">סמן כהושלם</button>`);
      } else if (s === ST.COMPLETED) {
        btns.push(`<button class="act" onclick="doSetStatus('${id}','${ST.CLOSED}', this)">סגור</button>`);
      } else {
        btns.push('<span class="empty">—</span>');
      }
      // Edit only before approval; delete always available to Roy/Sandra.
      if ([ST.REQUEST, ST.PENDING].includes(s)) {
        btns.push(`<button class="act" onclick="doEdit('${id}', this)">עריכה</button>`);
      }
      // Block / unblock (increment 36) — manager tier only, on still-open requests. The server
      // enforces canBlock regardless of what the UI shows. Labelled "תקוע" (stuck): the request
      // cannot proceed — waiting on a part, a supplier, or access.
      if (canBlockUI() && ![ST.CLOSED, ST.NOT_APPROVED, ST.COMPLETED].includes(s)) {
        btns.push(isBlockedUI(r)
          ? `<button class="act" onclick="doUnblock('${id}', this)">בטל תקיעה</button>`
          : `<button class="act" title="דרישה שאינה יכולה להתקדם — ממתינה לחלק, לספק או לגישה" onclick="doBlock('${id}', this)">תקוע</button>`);
      }
      // Delete is destructive and EXEC-ONLY (ops_manager / ceo), mirroring Code.gs handleDeleteRequest_
      // (isManagement_). field_ops/tier-B never see it — no delete button that would 403.
      if (isExecUI()) {
        btns.push(`<button class="act danger" onclick="doDelete('${id}', this)">מחיקה</button>`);
      }
      return btns.join('');
    }

    // In-flight spinner for an action button — the same pattern as the #79 login button
    // (src/server.js setLoading): disable the button and show a spinner INSIDE it while the POST
    // runs. Returns a restore() that puts the label back and re-enables the button. Safe to call
    // with a falsy btn (returns a no-op), so post() works whether or not a button was passed.
    function setBtnLoading(btn) {
      if (!btn) return () => {};
      const label = btn.innerHTML;
      btn.disabled = true; btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true');
      btn.innerHTML = '<span class="act-spin" aria-hidden="true"></span>';
      return () => { btn.disabled = false; btn.classList.remove('busy'); btn.removeAttribute('aria-busy'); btn.innerHTML = label; };
    }

    // Returns true when the write succeeded, false otherwise — modal confirms use this to close on
    // success but stay open (with the error) on failure. If `btn` is given it spins through the POST
    // and is restored when the request settles (on failure so it can be retried; on success the board
    // is reloaded and card buttons are replaced, so the restore is a harmless no-op).
    async function post(action, payload, btn) {
      const restore = setBtnLoading(btn);
      try {
        const res = await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload, token: window.__STAFF_TOKEN__ || '' }) });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'שגיאה');
        showMsg('ok', 'בוצע.');
        await load();
        return true;
      } catch (e) {
        // A permission rejection from the server (a gate mismatch) is shown as a clean Hebrew message,
        // never the raw upstream "Forbidden: role not authorized…" text. The UI already hides actions a
        // role may not take (approve above threshold, delete), so this is a defensive fallback.
        const raw = String((e && e.message) || '');
        showMsg('err', /forbidden|not authorized|unauthorized/i.test(raw) ? 'אין לך הרשאה לפעולה זו.' : 'הפעולה נכשלה: ' + raw);
        return false;
      } finally {
        restore();
      }
    }

    window.doApprove = (id, btn) => post('approve', { id, by: who() }, btn);
    window.doReject = (id, btn) => { const reason = prompt('סיבת אי-האישור:') || ''; post('reject', { id, by: who(), reason }, btn); };
    // "תקוע" (stuck) requires a reason (server also enforces); clearing it removes the flag.
    window.doBlock = (id, btn) => { const reason = (prompt('סיבת התקיעה (חובה):') || '').trim(); if (!reason) return; post('setBlocked', { id, blocked: true, reason }, btn); };
    window.doUnblock = (id, btn) => { if (!confirm('לבטל את סימון התקיעה?')) return; post('setBlocked', { id, blocked: false }, btn); };

    // Deferral via calendar modal + reminder N days before (default 7).
    let _deferId = null;
    const deferModal = document.getElementById('deferModal');
    const deferDate = document.getElementById('deferDate');
    const deferRemind = document.getElementById('deferRemind');
    const remindHint = document.getElementById('remindHint');

    function reminderDate(deferUntil, daysBefore) {
      if (!deferUntil) return '';
      const d = new Date(deferUntil + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      d.setDate(d.getDate() - (Number(daysBefore) || 0));
      return d.toISOString().slice(0, 10);
    }
    function updateRemindHint() {
      const rd = reminderDate(deferDate.value, deferRemind.value);
      remindHint.textContent = rd ? ('התזכורת תופיע ב-' + rd) : '';
    }
    deferDate.addEventListener('change', updateRemindHint);
    deferRemind.addEventListener('input', updateRemindHint);

    window.doDefer = (id) => {
      _deferId = id;
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
      deferDate.value = tomorrow.toISOString().slice(0, 10);
      deferDate.min = new Date().toISOString().slice(0, 10);
      deferRemind.value = 7;
      updateRemindHint();
      deferModal.classList.add('open');
    };
    document.getElementById('deferCancel').addEventListener('click', () => { deferModal.classList.remove('open'); _deferId = null; });
    document.getElementById('deferConfirm').addEventListener('click', async (ev) => {
      if (!_deferId || !deferDate.value) { deferModal.classList.remove('open'); return; }
      const remind_days = Number(deferRemind.value) || 0;
      // Spinner shows in the open modal while the POST runs; close only if it succeeded.
      const ok = await post('defer', { id: _deferId, by: who(), deferred_until: deferDate.value, remind_days, remind_on: reminderDate(deferDate.value, remind_days) }, ev.currentTarget);
      if (ok) { deferModal.classList.remove('open'); _deferId = null; }
    });
    const TRADES = ['חשמלאי', 'אינסטלטור', 'איש מזגנים', 'צבעי', 'איש בריכות', 'איש רשתות', 'עבודות אלומיניום', 'עבודות נגרות', 'אחר'];

    // "העברה ל" — modal: internal (lead auto-resolved from the request's house) or external (trade).
    let _referId = null;
    const referModal = document.getElementById('referModal');
    const referTradeSel = document.getElementById('referTrade');
    TRADES.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; referTradeSel.appendChild(o); });

    // Internal leads pickable when referring a request (default = the house's own lead).
    const ASSIGN_LEADS = ['רמי', 'צחי', 'רועי'];
    const referLeadSel = document.getElementById('referLeadSel');
    ASSIGN_LEADS.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; referLeadSel.appendChild(o); });

    function leadForHouse(house) {
      const h = allHouses.find(x => x.name === house);
      return h ? (h.technician || '') : '';
    }
    function referType() {
      const el = document.querySelector('input[name="referType"]:checked');
      return el ? el.value : 'internal';
    }
    function syncReferFields() {
      const ext = referType() === 'external';
      document.getElementById('referExternalField').style.display = ext ? 'block' : 'none';
      document.getElementById('referInternalField').style.display = ext ? 'none' : 'block';
    }
    document.querySelectorAll('input[name="referType"]').forEach(r => r.addEventListener('change', syncReferFields));

    window.doAssign = (id) => {
      _referId = id;
      const r = allRequests.find(x => String(x.id) === String(id));
      const lead = r ? leadForHouse(r.house) : '';
      // Default the picker to the house's own lead; fall back to first option if unknown.
      referLeadSel.value = ASSIGN_LEADS.indexOf(lead) !== -1 ? lead : ASSIGN_LEADS[0];
      const hint = document.getElementById('referLeadHint');
      if (hint) hint.textContent = lead
        ? ('אחראי הבית ' + (r ? r.house : '') + ': ' + lead + ' — ניתן לשנות')
        : 'לא הוגדר אחראי לבית זה — בחר/י ידנית';
      document.querySelector('input[name="referType"][value="internal"]').checked = true;
      document.getElementById('referMarkOnly').checked = false;
      syncReferFields();
      referModal.classList.add('open');
    };
    document.getElementById('referCancel').addEventListener('click', () => { referModal.classList.remove('open'); _referId = null; });
    document.getElementById('referConfirm').addEventListener('click', async (ev) => {
      if (!_referId) { referModal.classList.remove('open'); return; }
      const id = _referId;
      let result;
      if (referType() === 'internal') {
        const lead = referLeadSel.value;
        if (!lead) { showMsg('err', 'בחר/י אחראי.'); return; }
        result = post('assign', { id, by: who(), assigned_to: lead, assignment_type: 'internal' }, ev.currentTarget);
      } else {
        const trade = referTradeSel.value;
        if (document.getElementById('referMarkOnly').checked) result = post('markExternal', { id, by: who(), trade }, ev.currentTarget);
        else result = post('assign', { id, by: who(), assigned_to: trade, assignment_type: 'external', trade }, ev.currentTarget);
      }
      // Spinner shows in the open modal while the POST runs; close only if it succeeded.
      if (await result) { referModal.classList.remove('open'); _referId = null; }
    });
    window.doComplete = (id, btn) => { const cost = prompt('עלות בפועל (אפשר ריק):') || ''; const notes = prompt('הערות סיום (אפשר ריק):') || ''; post('setStatus', { id, by: who(), to: ST.COMPLETED, actual_cost: cost, completion_notes: notes }, btn); };
    window.doSetStatus = (id, to, btn) => post('setStatus', { id, by: who(), to }, btn);
    window.doConfirmFinding = (fid, btn) => post('confirmFinding', { finding_id: fid, by: who() }, btn);
    window.doDelete = (id, btn) => { if (confirm('למחוק את הדרישה? הפעולה תתועד אך השורה תוסר.')) post('deleteRequest', { id, by: who() }, btn); };
    window.doEdit = (id, btn) => {
      const r = allRequests.find(x => String(x.id) === String(id));
      if (!r) return;
      const description = prompt('תיאור:', r.description || ''); if (description === null) return;
      const location_in_house = prompt('מיקום בבית:', r.location_in_house || ''); if (location_in_house === null) return;
      const estimated_cost = prompt('עלות משוערת (₪, ריק = לא ידוע):', r.estimated_cost || ''); if (estimated_cost === null) return;
      post('editRequest', { id, by: who(), description, location_in_house, estimated_cost }, btn);
    };

    function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    document.getElementById('who').addEventListener('change', render);
    document.getElementById('filterHouse').addEventListener('change', render);
    document.getElementById('filterLead').addEventListener('change', render);

    // In-dashboard create request (nav cleanup). Reuses the loaded house list + the shared post() helper
    // (which authenticates via the Bearer shim, reloads the board, and shows the result banner). The server
    // stamps created_by from the session token, so the modal never collects it.
    const createModal = document.getElementById('createModal');
    document.getElementById('openCreate').addEventListener('click', () => {
      const sel = document.getElementById('crHouse');
      sel.innerHTML = '<option value="" disabled selected>בחר/י בית…</option>';
      allHouses.forEach(h => { const o = document.createElement('option'); o.value = h.name; o.textContent = h.name; sel.appendChild(o); });
      document.getElementById('crCategory').selectedIndex = 0;
      document.getElementById('crUrgency').value = 'רגיל';
      document.getElementById('crDescription').value = '';
      document.getElementById('crLocation').value = '';
      createModal.classList.add('open');
    });
    document.getElementById('crCancel').addEventListener('click', () => createModal.classList.remove('open'));
    document.getElementById('crConfirm').addEventListener('click', async (ev) => {
      const house = document.getElementById('crHouse').value;
      const category = document.getElementById('crCategory').value;
      const urgency = document.getElementById('crUrgency').value;
      const description = document.getElementById('crDescription').value.trim();
      const location_in_house = document.getElementById('crLocation').value.trim();
      if (!house) return showMsg('err', 'יש לבחור בית.');
      if (!category) return showMsg('err', 'יש לבחור קטגוריה.');
      if (!urgency) return showMsg('err', 'יש לבחור דחיפות.');
      // Spinner shows in the open modal while the POST runs; close only if it succeeded.
      const ok = await post('createRequest', { house, category, urgency, description, location_in_house }, ev.currentTarget);
      if (ok) createModal.classList.remove('open');
    });

    load();
  </script>
  <script>
    // PWA: register the service worker so the app is installable to the home
    // screen and opens standalone. Guarded — a failed registration must never
    // break the page.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
