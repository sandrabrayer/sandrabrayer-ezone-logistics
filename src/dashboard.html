<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZone לוגיסטיקה — לוח בקרה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #15171c; --bg2: #1b1e24; --card: #1f232b; --card-line: #333a45;
      --ink: #eef1f5; --muted: #8b93a0;
      --accent: #2dd4bf; --accent-2: #5eead4;
      --accent-grad: linear-gradient(120deg, #14b8a6 0%, #2dd4bf 50%, #5eead4 100%);
      --accent-soft: rgba(45,212,191,.12); --glow: rgba(45,212,191,.45);
      --go: #14b8a6; --go-press: #0f9488; --amber: #e0a23a; --red: #e0584a;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background: radial-gradient(1100px 480px at 82% -12%, #262b36 0%, transparent 58%), var(--bg);
      font-family: 'Heebo', sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--card-line);
      background: linear-gradient(180deg, var(--bg2), transparent);
    }
    /* brand = app emblem + Hebrew name only (RTL: emblem sits at the start/right of the name) */
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: .02em; font-size: 1.05rem; white-space: nowrap; }
    .brand .emblem { width: 30px; height: 30px; flex: none; display: block; }
    .brand .name { color: var(--ink); }
    .tab { font-size: .85rem; font-weight: 800; color: #14171c; padding: 8px 18px; border-radius: 999px; border: none; background: var(--accent-grad); }
    /* "ממתין לאישור שלי" toggle + ops-manager pending badge */
    .chk { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink); cursor: pointer; }
    .chk input { width: auto; }
    .badge { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); border: 1px solid rgba(45,212,191,.35); margin-inline-start: auto; }
    .badge .num { background: var(--accent-grad); color: #06201c; border-radius: 999px; padding: 1px 9px; font-weight: 800; }
    .badge.zero { opacity: .5; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 64px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin: 6px 0 4px; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
    /* identity + filters bar */
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .controls label { font-size: .8rem; color: var(--muted); margin-inline-end: 4px; }
    select { font-family: inherit; font-size: .92rem; color: var(--ink); background: #161a20; border: 1.5px solid var(--card-line); border-radius: 10px; padding: 9px 11px; }
    select:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
    select option { background: #161a20; color: var(--ink); }
    /* summary counters */
    .counters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .counter { flex: 1; min-width: 130px; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius); padding: 14px 16px; }
    .counter .n { font-size: 1.8rem; font-weight: 800; color: var(--accent-2); }
    .counter .l { font-size: .82rem; color: var(--muted); }
    /* status column groups */
    .group { margin-bottom: 26px; }
    .group h2 { font-size: 1.05rem; font-weight: 800; margin: 0 0 10px; display: flex; align-items: center; gap: 9px; }
    .group h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .req {
      background: var(--card);
      background: linear-gradient(var(--card), var(--card)) padding-box, var(--accent-grad) border-box;
      border: 1px solid transparent; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 0 26px -10px var(--glow);
    }
    .req .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .req .title { font-weight: 700; }
    .req .meta { color: var(--muted); font-size: .82rem; margin-top: 3px; }
    .req .cost { font-weight: 800; color: var(--accent-2); white-space: nowrap; }
    .pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
    .pill.urgent { background: rgba(224,162,58,.14); color: var(--amber); }
    .pill.emergency { background: rgba(224,88,74,.16); color: var(--red); }
    .pill.normal { background: var(--accent-soft); color: var(--accent-2); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button.act { font-family: inherit; font-size: .85rem; font-weight: 700; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--card-line); background: #161a20; color: var(--ink); cursor: pointer; transition: all .12s; }
    button.act:hover { border-color: var(--accent-2); }
    button.act.go { background: var(--go); color: #06201c; border: none; }
    button.act.go:hover { background: var(--go-press); }
    button.act.danger { color: var(--red); border-color: rgba(224,88,74,.4); }
    button.act:disabled { opacity: .4; cursor: default; }
    .empty { color: var(--muted); font-size: .9rem; padding: 8px 2px; }
    .msg { padding: 11px 14px; border-radius: 10px; font-weight: 600; margin-bottom: 16px; display: none; }
    .msg.ok { display: block; background: rgba(45,212,191,.12); color: var(--accent-2); border: 1px solid rgba(45,212,191,.35); }
    .msg.err { display: block; background: rgba(224,88,74,.1); color: #ef8478; border: 1px solid rgba(224,88,74,.35); }
    .loading { color: var(--muted); }
    @media (max-width: 600px) { .counter { min-width: 45%; } .brand .emblem { width: 28px; height: 28px; } .badge { margin-inline-start: 0; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="tab">לוח בקרה</div>
    <div class="brand">
      <svg class="emblem" viewBox="0 0 32 32" role="img" aria-label="לוגיסטיקה">
        <defs>
          <linearGradient id="emblemGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#14b8a6" />
            <stop offset="0.5" stop-color="#2dd4bf" />
            <stop offset="1" stop-color="#5eead4" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="7" fill="url(#emblemGrad)" />
        <g fill="none" stroke="#15171c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M16 6.5 25.5 11.75 25.5 20.25 16 25.5 6.5 20.25 6.5 11.75Z" />
          <path d="M6.5 11.75 16 17 25.5 11.75" />
          <path d="M16 17 16 25.5" />
        </g>
      </svg>
      <span class="name">לוגיסטיקה</span>
    </div>
  </div>
  <div class="wrap">
    <h1>לוח בקרה</h1>
    <p class="sub">ניהול דרישות — אישור, הקצאה ומעקב</p>

    <div class="controls">
      <span><label>משתמש:</label>
        <select id="who"><option value="" disabled selected>טוען…</option></select>
      </span>
      <span><label>בית:</label>
        <select id="filterHouse"><option value="">כל הבתים</option></select>
      </span>
      <span><label>אחראי:</label>
        <select id="filterLead">
          <option value="">הכל</option>
          <option value="רמי">רמי</option>
          <option value="צחי">צחי</option>
        </select>
      </span>
      <label class="chk"><input type="checkbox" id="mineOnly" /> ממתין לאישור שלי</label>
      <span class="badge zero" id="opsBadge" title="בקשות הממתינות לאישור מנהל.ת תפעול">
        ממתין לאישור תפעול <span class="num" id="opsBadgeNum">0</span>
      </span>
    </div>

    <div class="msg" id="msg"></div>
    <div class="counters" id="counters"></div>
    <div id="board"><p class="loading">טוען דרישות…</p></div>
  </div>

  <script>
    const EXEC_URL = window.__EXEC_URL__ || '__EXEC_URL__';
    const THRESHOLD_DEFAULT = 3000;

    const ST = {
      REQUEST: 'דרישה', PENDING: 'ממתין לאישור', APPROVED: 'מאושר',
      NOT_APPROVED: 'לא מאושר', DEFERRED: 'נדחה לתאריך', IN_PROGRESS: 'בביצוע',
      COMPLETED: 'הושלם', CLOSED: 'סגור',
    };
    // Display order of status groups on the board.
    const GROUPS = [
      { key: 'pending', title: 'ממתין לאישור', statuses: [ST.REQUEST, ST.PENDING] },
      { key: 'deferred', title: 'נדחה לתאריך', statuses: [ST.DEFERRED] },
      { key: 'approved', title: 'מאושר — להקצאה', statuses: [ST.APPROVED] },
      { key: 'inprogress', title: 'בביצוע', statuses: [ST.IN_PROGRESS] },
      { key: 'done', title: 'הושלם / סגור', statuses: [ST.COMPLETED, ST.CLOSED] },
      { key: 'rejected', title: 'לא מאושר', statuses: [ST.NOT_APPROVED] },
    ];

    let allRequests = [];
    let threshold = THRESHOLD_DEFAULT;
    let ceoCeiling = '';                 // '' = disabled
    let usersByName = {};                // name → { name, role, house }
    let houseStatus = {};                // name → status ('open' / 'pre-opening')
    const msg = document.getElementById('msg');
    const board = document.getElementById('board');

    // Hebrew labels for the resolved approver role (shown to non-approvers so they see who's needed).
    const ROLE_LABEL = {
      field_ops: 'מנהל.ת שטח', ops_manager: 'מנהל.ת תפעול', ceo: 'מנכ"לית',
      auto: 'אישור אוטומטי (חירום)',
    };
    const DISPATCH_ROLES = ['field_ops', 'ops_manager', 'ceo']; // defer / assign / complete / close
    const PENDING_STATUSES = [ST.REQUEST, ST.PENDING, ST.DEFERRED];

    function showMsg(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; setTimeout(() => { if (kind === 'ok') msg.className = 'msg'; }, 4000); }
    function who() { return document.getElementById('who').value; }
    function blank(c) { return c === '' || c === null || c === undefined; }
    function ceilingSet(v) { return !(v === '' || v === null || v === undefined); }
    function currentRole() { const u = usersByName[who()]; return u ? u.role : null; }
    function housePreOpening(house) { return houseStatus[house] === 'pre-opening'; }

    // Client mirror of the §6 chain in src/approval.js. Server enforces regardless.
    function resolveApprover(cost, urgency, house) {
      if (urgency === 'חירום') return 'auto';
      if (housePreOpening(house)) return 'ceo';
      if (ceilingSet(ceoCeiling) && !blank(cost) && Number(cost) > Number(ceoCeiling)) return 'ceo';
      if (!blank(cost) && Number(cost) > threshold) return 'ops_manager';
      return 'field_ops';
    }
    function canApprove(role, resolved) {
      if (role === 'ceo') return true;
      if (resolved === 'auto') return true;
      return role === resolved;
    }
    function canDispatch(role) { return DISPATCH_ROLES.includes(role); }
    function isPendingApproval(r) { return PENDING_STATUSES.includes(r.status); }
    function isMinePending(r) {
      return isPendingApproval(r) && canApprove(currentRole(), resolveApprover(r.estimated_cost, r.urgency, r.house));
    }

    async function load() {
      try {
        const [reqRes, cfgRes, houseRes, userRes] = await Promise.all([
          fetch(EXEC_URL + '?action=requests').then(r => r.json()),
          fetch(EXEC_URL + '?action=config').then(r => r.json()),
          fetch(EXEC_URL + '?action=houses').then(r => r.json()),
          fetch(EXEC_URL + '?action=users').then(r => r.json()),
        ]);
        if (!reqRes.ok) throw new Error(reqRes.error || 'load failed');
        allRequests = reqRes.data || [];
        if (cfgRes.ok && cfgRes.data) {
          if (cfgRes.data.approval_threshold != null) threshold = Number(cfgRes.data.approval_threshold);
          ceoCeiling = cfgRes.data.ceo_ceiling != null ? cfgRes.data.ceo_ceiling : '';
        }
        if (houseRes.ok) {
          const sel = document.getElementById('filterHouse');
          houseRes.data.forEach(h => {
            houseStatus[h.name] = h.status;
            const o = document.createElement('option'); o.value = h.name; o.textContent = h.name; sel.appendChild(o);
          });
        }
        if (userRes.ok) {
          const sel = document.getElementById('who');
          sel.innerHTML = '';
          usersByName = {};
          userRes.data.forEach(u => {
            usersByName[u.name] = u;
            const o = document.createElement('option'); o.value = u.name; o.textContent = u.name; sel.appendChild(o);
          });
        }
        render();
      } catch (e) {
        board.innerHTML = '<p class="empty">שגיאה בטעינת הדרישות. רענן/י ונסה/י שוב.</p>';
        showMsg('err', 'לא ניתן לטעון את הדרישות.');
      }
    }

    function filtered() {
      const h = document.getElementById('filterHouse').value;
      const lead = document.getElementById('filterLead').value;
      const mine = document.getElementById('mineOnly').checked;
      return allRequests.filter(r =>
        (!h || r.house === h) &&
        (!lead || r.assigned_to === lead) &&
        (!mine || isMinePending(r)));
    }

    function render() {
      const reqs = filtered();
      // counters
      const open = reqs.filter(r => ![ST.CLOSED, ST.NOT_APPROVED, ST.COMPLETED].includes(r.status)).length;
      const pending = reqs.filter(r => [ST.REQUEST, ST.PENDING].includes(r.status)).length;
      const deferred = reqs.filter(r => r.status === ST.DEFERRED).length;
      const closed = reqs.filter(r => [ST.CLOSED, ST.COMPLETED].includes(r.status)).length;
      const mine = reqs.filter(isMinePending).length; // waiting for the logged-in role to approve
      document.getElementById('counters').innerHTML = [
        ['פתוחות', open], ['ממתין לאישור', pending], ['נדחו', deferred], ['הושלמו/נסגרו', closed], ['ממתין לאישור שלי', mine],
      ].map(([l, n]) => `<div class="counter"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      // Ops-manager pending badge (Olga's entry point) — global count, independent of the filters.
      const opsPending = allRequests.filter(r => isPendingApproval(r) &&
        resolveApprover(r.estimated_cost, r.urgency, r.house) === 'ops_manager').length;
      document.getElementById('opsBadgeNum').textContent = opsPending;
      document.getElementById('opsBadge').classList.toggle('zero', opsPending === 0);

      board.innerHTML = GROUPS.map(g => {
        const items = reqs.filter(r => g.statuses.includes(r.status));
        if (items.length === 0) return '';
        return `<div class="group"><h2><span class="dot"></span>${g.title} <span style="color:var(--muted);font-weight:500">(${items.length})</span></h2>${items.map(card).join('')}</div>`;
      }).join('') || '<p class="empty">אין דרישות להצגה.</p>';
    }

    function urgencyPill(u) {
      if (u === 'חירום') return '<span class="pill emergency">חירום</span>';
      if (u === 'דחוף') return '<span class="pill urgent">דחוף</span>';
      return '<span class="pill normal">רגיל</span>';
    }

    function card(r) {
      const cost = blank(r.estimated_cost) ? 'לא ידוע' : '₪' + r.estimated_cost;
      const meta = [r.house, r.category, r.created_by].filter(Boolean).join(' · ');
      return `<div class="req">
        <div class="head">
          <div>
            <div class="title">${escapeHtml(r.description || r.id)} ${urgencyPill(r.urgency)}</div>
            <div class="meta">${escapeHtml(meta)}${r.location_in_house ? ' · ' + escapeHtml(r.location_in_house) : ''}${r.assigned_to ? ' · אחראי: ' + escapeHtml(r.assigned_to) : ''}${r.deferred_until ? ' · נדחה ל-' + escapeHtml(r.deferred_until) : ''}</div>
          </div>
          <div class="cost">${cost}</div>
        </div>
        <div class="actions">${actionsFor(r)}</div>
      </div>`;
    }

    // Role-gated actions (increment 28): approval buttons render ONLY for the resolved approver of
    // this request; defer / assign / complete / close render only for dispatch-tier roles. Others
    // see who the request is waiting on. The server enforces all of this regardless of the UI.
    function actionsFor(r) {
      const s = r.status, id = r.id;
      const role = currentRole();
      const btns = [];
      if (isPendingApproval(r)) {
        const resolved = resolveApprover(r.estimated_cost, r.urgency, r.house);
        if (canApprove(role, resolved)) {
          btns.push(`<button class="act go" onclick="doApprove('${id}')">אישור</button>`);
          btns.push(`<button class="act danger" onclick="doReject('${id}')">דחייה</button>`);
        }
        if (canDispatch(role)) {
          btns.push(`<button class="act" onclick="doDefer('${id}')">דחה לתאריך</button>`);
        }
        if (!btns.length) btns.push(`<span class="empty">ממתין ל${ROLE_LABEL[resolved] || resolved}</span>`);
      } else if (s === ST.APPROVED) {
        if (canDispatch(role)) btns.push(`<button class="act go" onclick="doAssign('${id}')">הקצאה לביצוע</button>`);
        else btns.push('<span class="empty">—</span>');
      } else if (s === ST.IN_PROGRESS) {
        if (canDispatch(role)) btns.push(`<button class="act go" onclick="doComplete('${id}')">סמן כהושלם</button>`);
        else btns.push('<span class="empty">—</span>');
      } else if (s === ST.COMPLETED) {
        if (canDispatch(role)) btns.push(`<button class="act" onclick="doSetStatus('${id}','${ST.CLOSED}')">סגור</button>`);
        else btns.push('<span class="empty">—</span>');
      } else {
        btns.push('<span class="empty">—</span>');
      }
      return btns.join('');
    }

    async function post(action, payload) {
      try {
        const res = await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'שגיאה');
        showMsg('ok', 'בוצע.');
        await load();
      } catch (e) { showMsg('err', 'הפעולה נכשלה: ' + e.message); }
    }

    window.doApprove = (id) => post('approve', { id, by: who() });
    window.doReject = (id) => { const reason = prompt('סיבת הדחייה:') || ''; post('reject', { id, by: who(), reason }); };
    window.doDefer = (id) => { const d = prompt('דחה עד תאריך (YYYY-MM-DD):'); if (d) post('defer', { id, by: who(), deferred_until: d }); };
    window.doAssign = (id) => { const to = prompt('הקצה לאחראי (רמי / צחי / שם טכנאי חיצוני):'); if (to) post('assign', { id, by: who(), assigned_to: to, assignment_type: (to === 'רמי' || to === 'צחי') ? 'internal' : 'external' }); };
    window.doComplete = (id) => { const cost = prompt('עלות בפועל (אפשר ריק):') || ''; const notes = prompt('הערות סיום (אפשר ריק):') || ''; post('setStatus', { id, by: who(), to: ST.COMPLETED, actual_cost: cost, completion_notes: notes }); };
    window.doSetStatus = (id, to) => post('setStatus', { id, by: who(), to });

    function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    document.getElementById('who').addEventListener('change', render);
    document.getElementById('filterHouse').addEventListener('change', render);
    document.getElementById('filterLead').addEventListener('change', render);
    document.getElementById('mineOnly').addEventListener('change', render);
    load();
  </script>
</body>
</html>
