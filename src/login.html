<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EZone לוגיסטיקה — דרישה חדשה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* EZone Logistics — dark family theme. Same skeleton as Dashboard/Outpatient/Managers;
       signature accent is cement/steel gray (each app owns a hue: Dashboard cyan, Outpatient
       green, Managers pink — Logistics gray). Action button stays green like the family's
       primary actions; urgency color-codes amber/red as Outpatient does for due-soon/stopped. */
    :root {
      --bg: #15171c;
      --bg2: #1b1e24;
      --card: #1f232b;
      --card-line: #333a45;
      --ink: #eef1f5;
      --muted: #8b93a0;
      --accent: #2dd4bf;        /* teal — Logistics signature */
      --accent-2: #5eead4;      /* light teal */
      --accent-grad: linear-gradient(120deg, #14b8a6 0%, #2dd4bf 50%, #5eead4 100%);
      --accent-soft: rgba(45,212,191,.12);
      --glow: rgba(45,212,191,.45);   /* teal glow, family-style card halo */
      --go: #14b8a6;
      --go-press: #0f9488;
      --amber: #e0a23a;
      --red: #e0584a;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background:
        radial-gradient(1100px 480px at 82% -12%, #262b36 0%, transparent 58%),
        var(--bg);
      font-family: 'Heebo', "Segoe UI", system-ui, -apple-system, Arial, sans-serif; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--card-line);
      background: linear-gradient(180deg, var(--bg2), transparent);
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .02em; font-size: 1.05rem; white-space: nowrap; }
    .brand-emblem { width: 30px; height: 30px; flex: 0 0 auto; display: block; }
    .brand-name { color: var(--ink); }
    /* active tab: solid cement pill, like the family */
    .tab {
      font-size: .85rem; font-weight: 800; color: #14171c;
      padding: 8px 18px; border-radius: 999px; border: none;
      background: var(--accent-grad);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 64px; }
    header h1 {
      font-size: 1.6rem; font-weight: 800; margin: 6px 0 2px; letter-spacing: -.01em;
      color: #ffffff; width: fit-content;
    }
    header p { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
    /* card with the family's glowing accent border */
    .card {
      position: relative; background: var(--card);
      border: 1px solid transparent; border-radius: var(--radius); padding: 22px 19px;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        var(--accent-grad) border-box;
      box-shadow: 0 0 0 1px rgba(170,178,190,.05), 0 0 34px -6px var(--glow), 0 18px 40px rgba(0,0,0,.4);
    }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 7px; }
    .opt { color: var(--muted); font-weight: 500; font-size: .8rem; }
    input, select, textarea {
      width: 100%; font-family: inherit; font-size: 1rem; color: var(--ink);
      background: #161a20; border: 1.5px solid var(--card-line); border-radius: 11px;
      padding: 12px 13px; transition: border-color .15s, box-shadow .15s;
    }
    select option { background: #161a20; color: var(--ink); }
    input::placeholder, textarea::placeholder { color: #5b626d; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent-2);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 0 18px -4px var(--glow);
    }
    textarea { resize: vertical; min-height: 74px; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 5px; }
    .seg { display: flex; gap: 8px; }
    .seg label {
      flex: 1; margin: 0; cursor: pointer; text-align: center;
      border: 1.5px solid var(--card-line); border-radius: 11px; padding: 11px 6px;
      font-weight: 500; background: #161a20; color: var(--ink); transition: all .15s;
    }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg input:checked + span { font-weight: 700; }
    .seg label:has(input:checked) {
      border-color: var(--accent-2); background: var(--accent-soft); color: var(--accent-2);
      box-shadow: 0 0 16px -5px var(--glow);
    }
    .seg label:has(input[value="דחוף"]:checked) { border-color: var(--amber); background: rgba(224,162,58,.12); color: var(--amber); box-shadow: 0 0 16px -5px rgba(224,162,58,.5); }
    .seg label:has(input[value="חירום"]:checked) { border-color: var(--red); background: rgba(224,88,74,.14); color: var(--red); box-shadow: 0 0 16px -5px rgba(224,88,74,.6); }
    button.submit {
      width: 100%; margin-top: 6px; padding: 14px; font-size: 1.05rem; font-weight: 800;
      color: #06201c; background: var(--go); border: none; border-radius: 12px; cursor: pointer;
      transition: background .15s, transform .05s, box-shadow .15s;
      box-shadow: 0 0 22px -6px rgba(20,184,166,.6);
    }
    button.submit:hover { background: var(--go-press); }
    button.submit:active { transform: translateY(1px); }
    button.submit:disabled { opacity: .5; cursor: default; box-shadow: none; }
    .msg { margin-top: 14px; padding: 12px 14px; border-radius: 11px; font-weight: 600; display: none; }
    .msg.ok { display: block; background: rgba(52,194,126,.12); color: #5fd79b; border: 1px solid rgba(52,194,126,.35); }
    .msg.err { display: block; background: rgba(224,88,74,.1); color: #ef8478; border: 1px solid rgba(224,88,74,.35); }
    .loading { color: var(--muted); font-size: .85rem; }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { font-size: .92rem; font-weight: 700; color: #c8cdd6; text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid transparent; transition: all .12s; }
    .nav a:hover { color: var(--ink); border-color: var(--card-line); }
    .nav a.active { font-weight: 800; color: #14171c; background: var(--accent-grad); }

    /* ── Mobile responsive (≤640px) — step 1: two-row topbar, ≥40px touch targets, iOS no-zoom.
       Fully scoped to this media query so the desktop layout stays pixel-identical.
       RTL preserved: logical properties (padding-block / margin-block) only, no left/right. */
    @media (max-width: 640px) {
      /* hard-disable horizontal panning on Android — content already fits, nothing gets cut */
      html, body { overflow-x: hidden; max-width: 100vw; }
      /* topbar wraps: brand (+ .tab) on top, .nav on its own scrollable row below */
      .topbar { flex-wrap: wrap; gap: 10px; }
      .brand-emblem { width: 28px; height: 28px; }
      .nav {
        order: 2; flex-basis: 100%; width: 100%;
        flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; -ms-overflow-style: none;
        margin-block-start: 2px; padding-block-end: 2px;
      }
      .nav::-webkit-scrollbar { display: none; }
      .nav a { flex: 0 0 auto; white-space: nowrap; }
      /* ≥40px touch targets */
      .nav a, .tab { min-height: 40px; display: inline-flex; align-items: center; padding-block: 9px; }
      button, select, input { min-height: 40px; }
      /* 16px form fields prevent iOS focus zoom */
      input, select, textarea { font-size: 16px; }
      /* step 2 — intake form polish */
      /* seg groups stay 3-across but wrap gracefully on ~320px instead of squeezing */
      .seg { flex-wrap: wrap; }
      .seg label { min-width: 0; }
      /* tighter side padding lets the card breathe wider */
      .wrap { padding-inline: 14px; }
      /* primary action gets a taller touch target than the 40px default */
      button.submit { min-height: 48px; }
      /* larger toast text for readability */
      .msg { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <nav class="nav"></nav>
    <div class="brand"><img class="brand-emblem" src="/icon-v1-192.png" alt="" /><span class="brand-name">לוגיסטיקה</span></div>
  </div>
  <div class="wrap">
    <header>
      <h1>כניסת מנהלים</h1>
      <p>מתחבר/ת…</p>
    </header>
    <!-- The auth shim (injected in <head>) auto-opens the login overlay here (__FORCE_LOGIN__) with the
         LIVE active roster as its dropdown, and on success sends the user to their authenticated home. A
         link back to the public request form for anyone who reached this page by mistake. -->
    <div class="card">
      <p style="margin:0 0 12px">כדי להיכנס לדשבורד ולניהול יש להזדהות עם שם וסיסמה.</p>
      <p style="margin:0"><a href="/" style="color:var(--accent-2)">חזרה לדף הבית</a> · <a href="/request" style="color:var(--accent-2)">שליחת דרישה ללא סיסמה</a></p>
    </div>
  </div>

  <script>
    // PWA: register the service worker (guarded — a failed registration must never break the page).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
